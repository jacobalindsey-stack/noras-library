<style>
/* Layout: three stacked full-bleed layers (painted graveyard, 3D objects, effects); HUD pinned to the safe-area corners; menus and stage banners float as text over the scene */
:root{

.layer{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{z-index:1}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:4}

.stage{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--wax);opacity:.8;margin-top:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.candles{display:flex;gap:12px;align-items:flex-end;padding-top:16px}
.candle{position:relative;width:9px;border-radius:2px 2px 1px 1px;background:linear-gradient(90deg,#b38a52,var(--wax) 45%,#a87e47);transition:filter .4s}
.candle:nth-child(1){height:22px}.candle:nth-child(2){height:28px}.candle:nth-child(3){height:19px}
.candle::after{content:"";position:absolute;left:4px;bottom:100%;width:1px;height:4px;background:#2a1d14}
.candle::before{content:"";position:absolute;left:50%;bottom:calc(100% + 2px);width:8px;height:14px;margin-left:-4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fff7d0 0 20%,var(--ember) 75%);box-shadow:0 0 14px 4px rgba(255,122,26,.5);transform-origin:50% 100%;animation:flick .16s infinite alternate;transition:opacity .3s}

.buttons{display:flex;gap:8px}

.menu{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + clamp(70px,12vh,130px));padding-inline:20px;text-align:center;pointer-events:none;z-index:3}

function radFill(g, x, y, r0, r1, stops, box){
  const gr = g.createRadialGradient(x, y, r0, x, y, r1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr;
  if (box) g.fillRect(box[0], box[1], box[2], box[3]); else { g.beginPath(); g.arc(x, y, r1, 0, TAU); g.fill(); }
}
function facePath(){
  const p = new Path2D();
  p.moveTo(-0.53,-0.02); p.quadraticCurveTo(-0.36,-0.09,-0.15,-0.04); p.lineTo(-0.31,-0.39); p.quadraticCurveTo(-0.45,-0.2,-0.53,-0.02); p.closePath();
  p.moveTo(0.53,-0.02); p.quadraticCurveTo(0.36,-0.09,0.15,-0.04); p.lineTo(0.31,-0.39); p.quadraticCurveTo(0.45,-0.2,0.53,-0.02); p.closePath();
  p.moveTo(-0.09,0.13); p.lineTo(0.09,0.13); p.lineTo(0,-0.02); p.closePath();
  p.moveTo(-0.62,0.14); p.quadraticCurveTo(-0.46,0.3,-0.28,0.33);
  p.lineTo(-0.27,0.45); p.lineTo(-0.13,0.45); p.lineTo(-0.11,0.36);
  p.quadraticCurveTo(0.03,0.37,0.15,0.35);
  p.lineTo(0.16,0.45); p.lineTo(0.3,0.43); p.lineTo(0.3,0.32);
  p.quadraticCurveTo(0.48,0.28,0.62,0.14);
  p.quadraticCurveTo(0.5,0.52,0.13,0.65);
  p.lineTo(0.09,0.53); p.lineTo(-0.06,0.54); p.lineTo(-0.08,0.66);
  p.quadraticCurveTo(-0.46,0.62,-0.62,0.14);

}
function vein(g, x, y, a, len, w, d, rnd){
  const x2 = x + Math.cos(a)*len, y2 = y + Math.sin(a)*len;
  const cx = (x + x2)/2 + (rnd() - 0.5)*len*0.6, cy = (y + y2)/2 + (rnd() - 0.5)*len*0.6;
  g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(cx, cy, x2, y2); g.stroke();
  if (d > 0) {
    vein(g, x2, y2, a + (rnd() - 0.5)*1.1, len*0.72, w*0.7, d - 1, rnd);
    if (rnd() < 0.65) vein(g, x2, y2, a + (rnd() - 0.5)*1.8, len*0.6, w*0.6, d - 1, rnd);
  }
}
const SECTIONS = {
  pumpkin: ['#b04a06', '#f39a2e', '#ffc773', '#ffe07a', '#b9460a', 3],
  white:   ['#c9c2b0', '#f0c96e', '#fbe4a8', '#f2c25e', '#d39a3e', 9],
  gold:    ['#9a6600', '#ffcf3a', '#fff0a0', '#fff6c0', '#e0a015', 9],
  frost:   ['#6aa8cc', '#cfeeff', '#f2fbff', '#ffffff', '#9fd4ef', 6]
};
function section(c, type, r){
  const C = (rr, fill) => { c.fillStyle = fill; c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.fill(); };
  const RG = (r0, r1, a, b) => { const g = c.createRadialGradient(0, 0, r0, 0, 0, r1); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  if (SECTIONS[type]) {
    const p = SECTIONS[type];
    C(0.88*r, p[0]);
    C(0.82*r, RG(0.45*r, 0.82*r, p[2], p[1]));
    C(0.56*r, RG(0, 0.56*r, p[3], p[4]));
    c.strokeStyle = p[1]; c.lineWidth = 0.035*r; c.lineCap = 'round'; c.globalAlpha = 0.85;
    for (let i = 0; i < 8; i++) { const a = i/8*TAU + 0.3; c.beginPath(); c.moveTo(Math.cos(a)*0.56*r, Math.sin(a)*0.56*r); c.quadraticCurveTo(Math.cos(a + 0.5)*0.32*r, Math.sin(a + 0.5)*0.32*r, Math.cos(a + 1.1)*0.12*r, Math.sin(a + 1.1)*0.12*r); c.stroke(); }
    c.globalAlpha = 1;
    for (let i = 0; i < p[5]; i++) {
      const a = i/p[5]*TAU + 0.4, d = (0.24 + (i % 3)*0.1)*r;
      c.save(); c.translate(Math.cos(a)*d, Math.sin(a)*d); c.rotate(a);
      c.fillStyle = type === 'frost' ? '#ffffff' : '#f9efd4'; c.beginPath(); c.ellipse(0, 0, 0.075*r, 0.042*r, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(150,110,50,.7)'; c.lineWidth = 0.01*r; c.stroke();
      c.restore();
    }
  } else if (type === 'apple') {
    C(0.88*r, '#9e0a1e');
    C(0.83*r, RG(0.2*r, 0.83*r, '#fbf4d6', '#e2cc88'));
    c.fillStyle = 'rgba(210,190,120,.4)';
    for (let i = 0; i < 5; i++) { const a = i/5*TAU; c.beginPath(); c.ellipse(Math.cos(a)*0.14*r, Math.sin(a)*0.14*r, 0.11*r, 0.05*r, a, 0, TAU); c.fill(); }
    c.fillStyle = '#4a2a12';
    for (let i = 0; i < 5; i++) { const a = i/5*TAU + 0.6; c.beginPath(); c.ellipse(Math.cos(a)*0.16*r, Math.sin(a)*0.16*r, 0.055*r, 0.028*r, a, 0, TAU); c.fill(); }
    C(0.05*r, '#c9a06a');
  } else if (type === 'eye') {
    C(0.88*r, '#f2e9dc');
    C(0.8*r, '#7a0f1e');
    C(0.76*r, RG(0.05*r, 0.76*r, '#f6c2c8', '#a82a3e'));
    c.fillStyle = '#d9a54b'; c.beginPath(); c.ellipse(0.5*r, 0, 0.12*r, 0.2*r, 0, 0, TAU); c.fill();
    c.fillStyle = '#1a0a04'; c.beginPath(); c.ellipse(0.66*r, 0, 0.05*r, 0.16*r, 0, 0, TAU); c.fill();
  }
}

function initGL(){

// one reflection environment per stage, built once and kept (stage changes no longer stall mid-game)
const ENVS = [];
function setEnv(i){ scene.environment = envFor(i).texture; }
function envFor(i){
  if (ENVS[i]) return ENVS[i];
  const st = STAGES[i], es = new T.Scene();
  const geo = new T.SphereGeometry(100, 32, 16), pos = geo.attributes.position, cols = [];
  const top = col(st.sky[1]), mid = col(st.sky[3]), bot = col('#050308');
  for (let k = 0; k < pos.count; k++) {
    const y = pos.getY(k)/100;
    const c = y > 0 ? mid.clone().lerp(top, Math.min(1, y*1.4)) : mid.clone().lerp(bot, Math.min(1, -y*1.6));
    cols.push(c.r*1.6, c.g*1.6, c.b*1.6);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  const mats = [new T.MeshBasicMaterial({ side: T.BackSide, vertexColors: true })];
  es.add(new T.Mesh(geo, mats[0]));
  const add = (g, color, x, y, z, look) => { const m = new T.MeshBasicMaterial({ color, side: T.DoubleSide }); mats.push(m); const o = new T.Mesh(g, m); o.position.set(x, y, z); if (look) o.lookAt(0, 0, 0); es.add(o); };
  add(new T.SphereGeometry(12, 16, 8), LT[i].key.clone().multiplyScalar(4), 45, 60, 55);
  add(new T.SphereGeometry(26, 16, 8), LT[i].fill.clone().multiplyScalar(1.3), -30, -70, 40);
  add(new T.PlaneGeometry(46, 26), new T.Color(2.2, 2.2, 2.4), -55, 42, 62, true);
  add(new T.PlaneGeometry(10, 60), new T.Color(1.2, 1.2, 1.4), 70, 0, 40, true);
  const rtg = pmrem.fromScene(es, 0.03);
  es.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  mats.forEach(m => m.dispose());
  return (ENVS[i] = rtg);
}

function sceneGraveyard(g, st){
  const r1 = ridge(g, H*0.7, H*0.035, 3, st.ridge1);
  const hx = W*0.56, hs = Math.min(W, H)*0.09;
  house(g, hx, r1(hx) + 3, hs, st);
  g.strokeStyle = st.ridge2; g.lineCap = 'round';
  for (const fxp of [0.34, 0.41, 0.86]) { const bxp = W*fxp; branch(g, bxp, r1(bxp) + 2, Math.min(H*0.04, 34), -Math.PI/2, 2.2, 4, mulberry(fxp*100)); }
  const fb = g.createLinearGradient(0, H*0.66, 0, H*0.8);
  fb.addColorStop(0, `rgba(${st.band},0)`); fb.addColorStop(0.6, `rgba(${st.band},.14)`); fb.addColorStop(1, `rgba(${st.band},0)`);
  g.fillStyle = fb; g.fillRect(0, H*0.66, W, H*0.14);

  g.lineCap = 'round';

      g.beginPath(); g.moveTo(x - 3, t + 2); g.lineTo(x, t - 6); g.lineTo(x + 3, t + 2); g.closePath(); g.fill();
    }
    g.lineWidth = 2.6;
    for (const k of [0.25, 0.8]) { g.beginPath(); for (let x = fx0; x <= W + 10; x += 6) { const y = hillY(x) + 4 - fh*k; x === fx0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); }
  });
  const th = Math.min(H*0.08, 70);
  for (const [fxp, kind, hs2, tilt] of [[0.26, 'arch', 1, -0.06], [0.36, 'cross', 0.85, 0.09], [0.53, 'arch', 0.78, 0.04], [0.62, 'slab', 1.1, -0.05], [0.93, 'arch', 0.85, 0.07]])

  });
}

function render(){

let last = 0, frameN = 0, perfN = 0, perfSum = 0;
function loop(t){
  const raw = last ? (t - last)/1000 : 0.016, dt = Math.min(0.033, raw); last = t;
  frameN++;
  if (JOBS.length && frameN > 2) { if (state !== 'play' || frameN % 4 === 0) runJobs(state === 'play' ? 1 : 10); }
  else if (!JOBS.length && state === 'play' && raw < 0.25) {
    perfSum += raw;
    if (++perfN >= 120) {

      perfN = 0; perfSum = 0;
    }
  }
  update(dt); render();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { last = 0; });

function boot(data){
  if (data && data.bests) for (const k in bests) bests[k] = Math.max(bests[k], data.bests[k] || 0);
  setMode(mode);
  resize(); queueJobs(); updateHud();
  $('hint').hidden = true;
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ bests })) } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
}
(() => {
  const hint = document.getElementById('hint');
  const SRCS = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'

  let started = false, idx = 0;
  const start = () => { if (started || !window.THREE) return; started = true; clearInterval(poll); pumpkinSlashMain(); };
  const poll = setInterval(start, 100);
  function next(){
    if (started) return;
    if (idx >= SRCS.length) { setTimeout(() => { if (!started) { clearInterval(poll); hint.textContent = 'The 3D engine didn’t load. Check your connection and reload.'; } }, 5000); return; }
    const sc = document.createElement('script');
    sc.src = SRCS[idx++]; sc.onload = start; sc.onerror = next;

})();
