<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Charades</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='8' fill='%23ffc83d' stroke='%231a0f45' stroke-width='5'/%3E%3Crect x='15' y='23' width='34' height='18' rx='3' fill='%23fff8ec'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Lilita One'; src: url(fonts/lilita-one-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); font-weight: 800; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-900-normal.woff2) format('woff2'); font-weight: 900; font-display: swap; }

:root {
  --grape: #2b1a6e; --grape-2: #3a2690; --ink: #1a0f45; --paper: #fff8ec; --paper-2: #f3e9d6;
  --sun: #ffc83d; --mint: #12c98a; --tang: #ff8a1f; --tomato: #ff4d4d; --gum: #ff4f9a; --gold: #ffd23f;
  --display: 'Lilita One', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --ui: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px); --sa-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--grape); color: var(--paper); font-family: var(--ui); font-weight: 600;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; overscroll-behavior: none; touch-action: manipulation; }
body {
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, rgba(255, 200, 61, .2), transparent 70%),
    radial-gradient(circle at 1px 1px, rgba(255, 248, 236, .085) 1.3px, transparent 1.8px) 0 0 / 20px 20px,
    var(--grape);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
input { font: inherit; -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: calc(14px + var(--sa-t)) calc(16px + var(--sa-r)) calc(28px + var(--sa-b)) calc(16px + var(--sa-l)); }
.screen { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.screen.wide { max-width: 1040px; }

/* --- type */
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: .005em; line-height: 1; }
h1 { font-size: clamp(34px, 7vw, 52px); text-shadow: 0 4px 0 var(--ink); }
h2 { font-size: clamp(26px, 5vw, 34px); text-shadow: 0 3px 0 var(--ink); }
h3 { font-size: 22px; }
p { margin: 0; line-height: 1.4; }
.muted { color: rgba(255, 248, 236, .72); }
.center { text-align: center; }

/* --- buttons: chunky, inked, and they press down */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 10px 24px;
  font-family: var(--display); font-size: 24px; line-height: 1; color: var(--ink); background: var(--sun);
  border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active, .btn.down { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn.big { min-height: 76px; font-size: 34px; border-radius: 22px; padding: 12px 36px; }
.btn.paper { background: var(--paper); }
.btn.mint { background: var(--mint); }
.btn.tang { background: var(--tang); }
.btn.quiet { background: transparent; color: var(--paper); border-color: rgba(255, 248, 236, .45); box-shadow: none; font-size: 20px; min-height: 50px; }
.btn.quiet:active { transform: translateY(2px); background: rgba(255, 248, 236, .08); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }
.iconbtn { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; border: 3px solid rgba(255, 248, 236, .4);
  background: rgba(26, 15, 69, .35); color: var(--paper); font-size: 24px; padding: 0; }
.iconbtn:active { transform: translateY(2px); }
.iconbtn svg { width: 26px; height: 26px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.two .btn { flex: 1; font-size: 21px; padding: 10px 12px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; }

/* --- top bar */
.top { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.top h2 { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(26, 15, 69, .45);
  font-weight: 800; font-size: 15px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px rgba(18, 201, 138, .25); }
.dot.off { background: #9a8fc4; box-shadow: none; }
.dot.warn { background: var(--tang); box-shadow: 0 0 0 3px rgba(255, 138, 31, .25); }

/* --- panels */
.panel { background: rgba(26, 15, 69, .42); border: 2px solid rgba(255, 248, 236, .12); border-radius: 24px; padding: 18px; }
.paperpanel { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 7px 0 var(--ink); padding: 18px; }
.label { font-weight: 800; font-size: 15px; color: rgba(255, 248, 236, .75); margin-bottom: 8px; }

/* --- title */
.title { justify-content: center; align-items: center; text-align: center; gap: 22px; }
.wordmark { font-family: var(--display); font-size: clamp(56px, 15vw, 104px); line-height: .9; color: var(--paper); text-shadow: 0 6px 0 var(--ink);
  transform: rotate(-3deg); margin: 4px 0 2px; }
.hero { perspective: 900px; width: min(420px, 86vw); aspect-ratio: 2 / 1.05; margin: 6px auto 4px; position: relative; }
.hero .phone { position: absolute; inset: 0; border-radius: 30px; background: var(--ink); padding: 12px; box-shadow: 0 16px 0 rgba(26, 15, 69, .55);
  transform-origin: 50% 50%; transition: transform .38s cubic-bezier(.3, 1.4, .5, 1); }
.hero .screenface { position: absolute; inset: 12px; border-radius: 20px; background: var(--hc, #14a3a0); display: grid; place-items: center; overflow: hidden; }
.hero .face { width: 84%; height: 70%; border-radius: 14px; background: var(--paper); border: 3px solid var(--ink); display: grid; place-items: center;
  font-family: var(--display); color: var(--ink); font-size: clamp(28px, 9vw, 52px); transition: background .2s; }
.hero .verdict { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(30px, 9vw, 54px); color: var(--ink);
  opacity: 0; transition: opacity .12s; }
.hero.ok .verdict { background: var(--mint); opacity: 1; }
.hero.pass .verdict { background: var(--tang); opacity: 1; }
.hero.ok .phone { transform: rotateX(38deg) translateY(10px); }
.hero.pass .phone { transform: rotateX(-38deg) translateY(-6px); }
.hero .hint { position: absolute; display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 18px; color: var(--paper); opacity: .0; transition: opacity .2s; }
.hero .hint.down { left: 50%; bottom: -40px; transform: translateX(-50%); }
.hero .hint.up { left: 50%; top: -38px; transform: translateX(-50%); }
.hero.ok .hint.down, .hero.pass .hint.up { opacity: 1; }
.titlebtns { display: flex; flex-direction: column; gap: 14px; width: min(420px, 100%); margin-top: 34px; }
.titlemore { display: flex; gap: 12px; justify-content: center; }

/* --- players */
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; gap: 10px; align-items: center; }
.ava { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 24px;
  color: var(--ink); background: var(--c, var(--sun)); border: 3px solid var(--ink); }
.ava.sm { width: 34px; height: 34px; font-size: 18px; border-width: 2px; }
.ava.lg { width: 76px; height: 76px; font-size: 40px; }
.name { flex: 1; min-width: 0; height: 56px; border-radius: 16px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); padding: 0 14px;
  font-family: var(--ui); font-weight: 800; font-size: 22px; }
.name::placeholder { color: rgba(26, 15, 69, .38); }
.x { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 0; background: rgba(26, 15, 69, .45); color: var(--paper); font-size: 26px; display: grid; place-items: center; }
.seg { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.seg button { min-width: 64px; height: 48px; padding: 0 14px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  font-family: var(--display); font-size: 21px; box-shadow: 0 4px 0 var(--ink); }
.seg button.on { background: var(--sun); }
.seg button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opts { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 640px) { .opts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) {
  .decks { grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .deck { min-height: 128px; padding: 12px 8px 10px; gap: 6px; }
  .deck .disc { width: 58px; height: 58px; font-size: 32px; }
  .deck .t { font-size: 18px; }
}

/* --- decks */
.turnhead { display: flex; align-items: center; gap: 14px; }
.turnhead h1 { font-size: clamp(32px, 7vw, 46px); }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 16px 14px; }
.deck { position: relative; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
  padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-height: 150px; }
.deck:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.deck .disc { width: 72px; height: 72px; border-radius: 50%; background: var(--c); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 40px; line-height: 1; }
.deck .t { font-family: var(--display); font-size: 20px; line-height: 1.02; }
.deck .n { font-size: 13px; font-weight: 800; color: rgba(26, 15, 69, .55); margin-top: auto; }
.deck.mix .disc { background: conic-gradient(#14a3a0, #2f6bff, #8b5cf6, #c026d3, #ff4f9a, #f0473c, #f59e0b, #14a3a0); }

/* --- mini scoreboard */
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.scores .s { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(26, 15, 69, .45); font-weight: 800; }
.scores .s b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.scores .s.now { background: var(--sun); color: var(--ink); }

/* --- ready */
.ready { align-items: center; text-align: center; justify-content: center; gap: 20px; }
.ready > .top { align-self: stretch; }
.ready svg.head { width: min(300px, 70vw); height: auto; }
.legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.legend .l { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 18px; background: rgba(26, 15, 69, .45); font-family: var(--display); font-size: 22px; }
.legend .l i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 3px solid var(--ink); font-style: normal; color: var(--ink); font-size: 22px; }
.legend .ok i { background: var(--mint); }
.legend .pass i { background: var(--tang); }
.waitbar { width: min(320px, 80vw); height: 14px; border-radius: 999px; background: rgba(26, 15, 69, .5); overflow: hidden; }
.waitbar span { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .1s linear; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }

/* --- results */
.bigscore { display: flex; align-items: baseline; justify-content: center; gap: 14px; }
.bigscore .n { font-family: var(--display); font-size: clamp(90px, 24vw, 150px); line-height: .9; color: var(--sun); text-shadow: 0 7px 0 var(--ink); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.w { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--paper); color: var(--ink); font-weight: 800; font-size: 18px; border: 2px solid var(--ink); }
.w i { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 16px; border: 2px solid var(--ink); }
.w.ok i { background: var(--mint); }
.w.no { background: var(--paper-2); color: rgba(26, 15, 69, .62); }
.w.no i { background: var(--tang); }
.w .gold { margin-left: auto; font-family: var(--display); font-weight: 400; font-size: 15px; background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; }

/* --- final */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-top: 14px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(30%, 170px); }
.pod .avas { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.pod .who { font-family: var(--display); font-size: 22px; text-align: center; line-height: 1; overflow-wrap: anywhere; }
.pod .blk { width: 100%; border: 3px solid var(--ink); border-bottom: 0; border-radius: 16px 16px 0 0; display: grid; place-items: center; align-content: start; padding-top: 10px;
  font-family: var(--display); color: var(--ink); font-size: 34px; }
.pod.r1 .blk { height: 150px; background: var(--sun); }
.pod.r2 .blk { height: 110px; background: var(--paper); }
.pod.r3 .blk { height: 80px; background: #f2b27a; }
.pod .crown { font-size: 34px; line-height: 1; margin-bottom: -6px; }
.podbase { height: 14px; background: var(--ink); border-radius: 8px; margin: 0 auto; width: min(100%, 540px); }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
.card .hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 3px solid var(--ink); background: var(--sun); }
.card .hd h3 { flex: 1; }
.card table { width: 100%; border-collapse: collapse; font-weight: 800; }
.card td, .card th { padding: 10px 12px; text-align: left; border-bottom: 2px solid rgba(26, 15, 69, .12); vertical-align: middle; }
.card th { font-size: 13px; color: rgba(26, 15, 69, .6); font-weight: 800; }
.card td.tot { font-family: var(--display); font-weight: 400; font-size: 26px; text-align: right; }
.card tr:last-child td { border-bottom: 0; }
.card .turns { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tn { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(26, 15, 69, .08); font-size: 13px; white-space: nowrap; }
.rank { font-family: var(--display); font-weight: 400; font-size: 22px; width: 30px; }
.hist { display: flex; flex-direction: column; gap: 12px; }
.hitem { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink);
  border-radius: 20px; box-shadow: 0 5px 0 var(--ink); }
.hitem:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.hitem .when { font-size: 14px; color: rgba(26, 15, 69, .6); font-weight: 800; }
.hitem .win { font-family: var(--display); font-size: 22px; }
.empty { padding: 30px 10px; text-align: center; }

/* --- online */
.code { display: flex; gap: 10px; justify-content: center; }
.code span, .code input { width: 66px; height: 82px; border-radius: 18px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  font-family: var(--display); font-size: 48px; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 0 var(--ink); text-transform: uppercase; padding: 0; }
.code input:focus { background: #fff; outline: 4px solid var(--sun); outline-offset: 2px; }
.devs { display: flex; flex-direction: column; gap: 10px; }
.dev { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 18px; background: rgba(26, 15, 69, .42); }
.dev .who { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.pname { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border-radius: 999px; background: rgba(255, 248, 236, .1); font-weight: 800; font-size: 17px; }
.err { background: var(--tomato); color: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; font-weight: 800; }
.note { background: rgba(255, 200, 61, .14); border: 2px solid rgba(255, 200, 61, .5); border-radius: 16px; padding: 10px 14px; font-weight: 800; }
.banner { position: fixed; left: 50%; top: calc(10px + var(--sa-t)); transform: translateX(-50%); z-index: 80; }

/* --- sheets (settings, pause) */
.sheet { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: calc(16px + var(--sa-t)) 16px calc(16px + var(--sa-b)); background: rgba(14, 8, 40, .7); overflow-y: auto; }
.sheet .box { width: min(560px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--grape); border: 3px solid var(--ink);
  border-radius: 26px; box-shadow: 0 10px 0 var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.set { display: flex; flex-direction: column; gap: 8px; }
.set .n { font-size: 14px; color: rgba(255, 248, 236, .7); }
.meter { position: relative; height: 54px; border-radius: 16px; background: rgba(26, 15, 69, .55); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; }
.meter .z-ok { left: 0; background: rgba(18, 201, 138, .35); }
.meter .z-pass { right: 0; background: rgba(255, 138, 31, .35); }
.meter .needle { position: absolute; top: 6px; bottom: 6px; width: 8px; margin-left: -4px; left: 50%; border-radius: 4px; background: var(--paper); transition: left .05s linear; }
.meter .say { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 22px; }

/* --- the play stage (forehead, judge and watch views) */
#stage { position: fixed; inset: 0; z-index: 60; background: var(--dc, #14a3a0); overflow: hidden; touch-action: none; }
#stage .rot { position: absolute; left: 50%; top: 50%; display: grid; grid-template-rows: auto 1fr auto; gap: 2.2vmin;
  padding: calc(2.4vmin + var(--sa-t)) calc(3vmin + var(--sa-r)) calc(2.4vmin + var(--sa-b)) calc(3vmin + var(--sa-l)); }
#stage.turned .rot { padding: 3vmin; }
.sbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vmin; }
.clock { justify-self: start; font-family: var(--display); color: var(--paper); text-shadow: 0 .6vmin 0 var(--ink); font-size: clamp(30px, 11vmin, 92px); line-height: .9;
  font-variant-numeric: tabular-nums; min-width: 2.4em; }
.clock.hurry { color: var(--paper); background: var(--tomato); border: .5vmin solid var(--ink); border-radius: 2.5vmin; padding: .3vmin 2vmin .9vmin; text-shadow: 0 .5vmin 0 var(--ink); animation: hurry 1s steps(2) infinite; }
@keyframes hurry { 50% { transform: scale(1.06); } }
.tally { justify-self: end; display: flex; align-items: center; gap: 1.4vmin; font-family: var(--display); color: var(--ink); background: var(--paper); border: .5vmin solid var(--ink);
  border-radius: 999px; padding: .6vmin 2.4vmin .6vmin 1vmin; font-size: clamp(24px, 8vmin, 70px); line-height: 1; }
.tally i { width: 1em; height: 1em; border-radius: 50%; display: grid; place-items: center; background: var(--mint); border: .4vmin solid var(--ink); font-style: normal; font-size: .62em; }
.pausebtn { width: clamp(46px, 11vmin, 76px); height: clamp(46px, 11vmin, 76px); border-radius: 50%; border: .5vmin solid var(--ink); background: rgba(255, 248, 236, .9); color: var(--ink);
  display: grid; place-items: center; padding: 0; }
.pausebtn svg { width: 46%; height: 46%; }
.wordcard { position: relative; min-height: 0; background: var(--paper); border: max(4px, .9vmin) solid var(--ink); border-radius: 4.5vmin; box-shadow: 0 1.6vmin 0 rgba(26, 15, 69, .5);
  display: grid; place-items: center; padding: 3vmin 4vmin; overflow: hidden; }
.wordcard.gold { background: radial-gradient(ellipse at 30% 20%, #fff6c8, var(--gold) 55%, #f5b91f); }
.wordcard .word { font-family: var(--display); color: var(--ink); text-align: center; line-height: .98; overflow-wrap: normal; word-break: keep-all; hyphens: none; max-width: 100%; }
.wordcard .x2 { position: absolute; top: 2vmin; right: 2.4vmin; font-family: var(--display); font-size: clamp(22px, 7vmin, 60px); color: var(--ink); background: var(--paper);
  border: .5vmin solid var(--ink); border-radius: 999px; padding: .2vmin 2vmin .6vmin; transform: rotate(8deg); }
.wordcard .blind { font-family: var(--display); color: var(--ink); text-align: center; font-size: clamp(40px, 16vmin, 150px); line-height: 1; }
.wordcard .sub { font-family: var(--ui); font-weight: 800; color: rgba(26, 15, 69, .6); font-size: clamp(16px, 4vmin, 30px); text-align: center; margin-top: 1.5vmin; }
.foot { display: flex; align-items: center; gap: 2vmin; min-height: 0; }
.decktag { display: inline-flex; align-items: center; gap: 1.2vmin; color: var(--paper); font-family: var(--display); font-size: clamp(18px, 5vmin, 40px); text-shadow: 0 .4vmin 0 var(--ink); }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin; flex: 1; }
.judge .btn { min-height: clamp(80px, 12vh, 150px); font-size: clamp(26px, 8vmin, 64px); border-radius: 3.6vmin; box-shadow: 0 1.2vmin 0 var(--ink); border-width: max(3px, .6vmin); }
.judge .btn:active { transform: translateY(.9vmin); box-shadow: 0 .3vmin 0 var(--ink); }
.judge .key { font-family: var(--ui); font-size: .42em; opacity: .55; }
/* landscape judge: buttons on each side of the card, under each thumb */
#stage .jl, #stage .jr { display: none; }
#stage.side .rot { grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr; }
#stage.side .sbar { grid-column: 1 / -1; grid-row: 1; }
#stage.side .jl, #stage.side .jr { grid-row: 2; display: flex; }
#stage.side .jl { grid-column: 1; }
#stage.side .wordcard { grid-column: 2; grid-row: 2; }
#stage.side .jr { grid-column: 3; }
#stage.side .jl .btn, #stage.side .jr .btn { width: clamp(110px, 22vmin, 220px); height: 100%; min-height: 0; font-size: clamp(22px, 6vmin, 52px); white-space: nowrap; border-radius: 3.6vmin; box-shadow: 0 1.2vmin 0 var(--ink); border-width: max(3px, .6vmin); flex-direction: column; }
#stage.side .jl .btn:active, #stage.side .jr .btn:active { transform: translateY(.9vmin); box-shadow: 0 .3vmin 0 var(--ink); }
#stage.side .foot { display: none; }
.big-ico { font-size: 1.3em; line-height: 1; }
#fx, .flash, .streak { pointer-events: none; }
.flash { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2vmin; font-family: var(--display); color: var(--ink); z-index: 3; text-align: center; }
.flash.ok { background: var(--mint); }
.flash.pass { background: var(--tang); }
.flash.time { background: var(--tomato); color: var(--paper); text-shadow: 0 1vmin 0 var(--ink); }
.flash.count { background: var(--dc); color: var(--paper); text-shadow: 0 1.2vmin 0 var(--ink); }
.flash .big { font-size: clamp(56px, min(30vmin, 16vw), 300px); line-height: .9; }
.flash.count .big { font-size: clamp(110px, 62vmin, 520px); }
.flash .small { font-size: clamp(22px, 7vmin, 60px); }
.flash.pop .big { animation: pop .32s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
.streak { position: absolute; left: 50%; top: 50%; z-index: 4; font-family: var(--display); color: var(--ink); background: var(--sun); border: .6vmin solid var(--ink); border-radius: 999px;
  padding: 1vmin 4vmin 1.8vmin; font-size: clamp(26px, 9vmin, 80px); transform: translate(-50%, 120%) rotate(-4deg); white-space: nowrap; animation: streak 1.1s ease-out forwards; }
@keyframes streak { 0% { opacity: 0; transform: translate(-50%, 160%) scale(.6) rotate(-4deg); } 18% { opacity: 1; transform: translate(-50%, 110%) scale(1.08) rotate(-4deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 70%) scale(1) rotate(-4deg); } }
.who-tag { font-family: var(--display); color: var(--paper); font-size: clamp(18px, 5vmin, 40px); text-shadow: 0 .4vmin 0 var(--ink); }
.tiltfix { position: absolute; left: 50%; bottom: calc(4vmin + var(--sa-b)); transform: translateX(-50%); z-index: 5; }
#confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

/* a phone held sideways: title side by side */
@media (orientation: landscape) and (max-height: 520px) {
  .title { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "mark btns" "hero btns"; align-content: center; column-gap: 28px; row-gap: 10px; max-width: 900px; }
  .wordmark { grid-area: mark; font-size: 58px; }
  .hero { grid-area: hero; width: min(330px, 40vw); margin: 34px auto 30px; }
  .titlebtns { grid-area: btns; margin-top: 0; width: 100%; }
}
/* iPad and computer: everything a size up */
@media (min-width: 760px) and (min-height: 740px) {
  .screen, .sheet .box { zoom: 1.15; }
}

@media (prefers-reduced-motion: reduce) {
  .hero .phone, .flash.pop .big, .streak, .clock.hurry, .pulse { animation: none !important; transition: none !important; }
}
</style>
