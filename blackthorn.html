  /* ---------------- hints ---------------- */
  function part2Step() {
    const ink = { hint: 'Your new page needs ink. Rattle furniture and pop pots for Wisps!' };
    const lib = () => {
      if (!S.spells.gust) return { room: 'archives', at: [3, 5], hint: "West of the landing is the Grand Library. Quill's Archives lie beyond it. Something windy was filed there." };
      if (!hasSpell('gust')) return Object.assign({ room: 'archives' }, ink);
      if (!S.flags.stacks_fan) return { room: 'library', at: [32, 3], hint: 'The great fan beside the Upper Stacks is stuck. Give it a good Gust!' };
      return { room: 'stacks', at: [20, 8], hint: 'The Unbound guards the Minute Hand. Blow its pages away with Gust, then Spark the book!' };
    };
    const doll = () => {
      if (!S.flags.doll_intro) return { room: 'nursery', at: [9, 5], hint: 'The Twins live in the Nursery, off the Long Gallery. They have a very fancy dollhouse.' };
      if (!S.spells.thimble) {
        const opened = S.rooms.toykitchen && S.rooms.toykitchen.gates && S.rooms.toykitchen.gates[1];
        if (!opened && S.keys === 0) return { room: 'barracks', at: [2, 4], hint: 'In the dollhouse, the kitchen door is locked. The toy soldiers guard a key.' };
        return { room: 'musicbox', at: [9, 6], hint: 'The dollhouse Music-Box Room hides a page. Past the Toy Kitchen.' };
      }
      if (!hasSpell('thimble')) return Object.assign({ room: 'musicbox' }, ink);
      return { room: 'keep', at: [20, 8], hint: 'Thimble shrinks those giant blocks in the Doll Foyer. Captain Tin waits above the Block Tower.' };
    };
    const pend = Object.keys(S.parts).some(k => !S.flags['ret_' + k]);
    if (pend) return { room: 'foyer', at: [12, 5], hint: 'You carry one of my parts! Bring it here, girl.' };
    if (S.flags.doll_intro && !S.parts.mainspring) return doll();
    if (!S.parts.minute_hand) return lib();
    if (!S.parts.mainspring) return doll();
    return { room: 'gallery', at: [19, 3], hint: 'Three parts home. The Conservatory is still choked with spores and the Music Room lies silent. They will wake soon.' };
  }

  /* ---------------- hedge maze ---------------- */
  function makeMaze() {
    const W = 40, H = 28, CW = 12, CH = 8, g = [];
    for (let y = 0; y < H; y++) { g.push([]); for (let x = 0; x < W; x++) g[y].push('#'); }
    const cx = i => 2 + 3 * i, cy = j => 4 + 3 * j, key = (i, j) => i + ',' + j, r = RNG(90210), adj = {}, seenC = new Set();
    const carveCell = (i, j) => { for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) g[cy(j) + y][cx(i) + x] = '.'; };
    const carveBetween = (i, j, a, b) => { if (a !== i) { const wx = cx(Math.min(i, a)) + 2; for (let y = 0; y < 2; y++) g[cy(j) + y][wx] = '.'; } else { const wy = cy(Math.min(j, b)) + 2; for (let x = 0; x < 2; x++) g[wy][cx(i) + x] = '.'; } };
    const link = (a, b) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); };
    const start = [11, 5], goal = [6, 7], stack = [start]; seenC.add(key(start[0], start[1])); carveCell(start[0], start[1]);
    while (stack.length) {
      const [i, j] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => [i + a, j + b]).filter(([a, b]) => a >= 0 && b >= 0 && a < CW && b < CH && !seenC.has(key(a, b)));
      if (!nb.length) { stack.pop(); continue; }
      const [a, b] = nb[r.int(0, nb.length - 1)];
      carveCell(a, b); carveBetween(i, j, a, b); seenC.add(key(a, b)); link(key(i, j), key(a, b)); stack.push([a, b]);
    }
    for (let y = 19; y <= 20; y++) for (let x = 37; x <= 38; x++) g[y][x] = '.';
    // solution path (BFS over cells)
    const prev = {}, q = [key(start[0], start[1])]; prev[q[0]] = null;
    while (q.length) { const k = q.shift(); if (k === key(goal[0], goal[1])) break; for (const n of adj[k] || []) if (!(n in prev)) { prev[n] = k; q.push(n); } }
    const route = []; for (let k = key(goal[0], goal[1]); k; k = prev[k]) route.unshift(k.split(',').map(Number));
    const onRoute = new Set(route.map(([i, j]) => key(i, j)));
    const center = ([i, j]) => [cx(i) * TS + 16, cy(j) * TS + 16];
    const path = [[38 * TS, 20 * TS]];
    for (let n = 0; n < route.length; n++) { const c = center(route[n]); path.push(c); if (n + 1 < route.length) { const d = center(route[n + 1]); path.push([(c[0] + d[0]) / 2, (c[1] + d[1]) / 2]); } }
    path.push([21 * TS, 27 * TS]);
    // dead ends (not on the route) for treasure; walls to swap for brambles
    const dead = []; for (let i = 0; i < CW; i++) for (let j = 0; j < CH; j++) { const k = key(i, j); if ((adj[k] || []).length === 1 && !onRoute.has(k)) dead.push([i, j]); }
    dead.sort((a, b) => (Math.abs(b[0] - 11) + Math.abs(b[1] - 5)) - (Math.abs(a[0] - 11) + Math.abs(a[1] - 5)));
    const brambles = [];
    for (let tries = 0; tries < 400 && brambles.length < 14; tries++) {
      const i = r.int(0, CW - 1), j = r.int(0, CH - 1), horiz = r.chance(0.5);
      const a = horiz ? [i + 1, j] : [i, j + 1]; if (a[0] >= CW || a[1] >= CH) continue;
      if ((adj[key(i, j)] || []).indexOf(key(a[0], a[1])) >= 0) continue;
      const tiles = horiz ? [[cx(i) + 2, cy(j)], [cx(i) + 2, cy(j) + 1]] : [[cx(i), cy(j) + 2], [cx(i) + 1, cy(j) + 2]];
      if (tiles.some(([x, y]) => g[y][x] !== '#')) continue;
      for (const [x, y] of tiles) { g[y][x] = '.'; brambles.push([x, y]); }
    }
    return { map: g.map(row => row.join('')), path, dead, brambles, cx, cy };
  }

    if (!seen('lakeshore')) return { room: 'terrace', at: [9, 4], hint: 'The Lake has woken! Go north through the Ballroom and out across the Moonlit Terrace.' };
    if (!seen('lanternpath')) return { room: 'lake', at: [19, 20], hint: 'Cross the Lake. Bloom grows lily pads, Frost makes ice, and the Boathouse keeps a pair of oars.' };
    if (!S.flags.bell_rung) return { room: 'belltower', at: [9, 8], hint: 'The churchyard gate is chained. Ring the old bell in the Bell Tower with Chime.' };
    if (!seen('cata_stair')) return { room: 'mausoleum', at: [9, 7], hint: 'The crypt under the graveyard is locked. Light every candle in the Mausoleum and it will lend you a key.' };
    if (!hasSpell('beckon')) return { room: 'cata_chasm', at: [16, 7], hint: 'The catacombs are full of chasms. Only a far-reaching hand could pull their bridges down. Beckon waits behind the looking-glass.' };

    if (!S.flags.boss_mossbones) return { room: 'ossuary', at: [20, 9], hint: 'Old Mossbones keeps the Moon Dial in the Ossuary. Beckon away his lantern and he is blind!' };
    return { room: 'foyer', at: [12, 5], hint: 'Seven parts home. Only the Pendulum remains... somewhere below stairs, where the house still sleeps.' };
