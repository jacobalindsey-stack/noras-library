<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0e0a">
<title>Georgia Buns</title>
<style>
html,body{margin:0;height:100%;background:#1a0e0a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#play{position:fixed;left:0;top:0;overflow:hidden;background:#000}
#screen{display:block;width:100%;height:100%}
#deck{position:fixed;left:0;bottom:0;width:100%;background:#4e3220;border-top:4px solid #2a140c;box-shadow:inset 0 4px 0 #7a5236;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 6px,transparent 6px 12px)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}
button{font:inherit;cursor:pointer}
.hud{position:fixed;z-index:5;border:0;padding:0;background:none;line-height:0}
#easy{left:max(12px,env(safe-area-inset-left));top:12px}
#pause{right:max(12px,env(safe-area-inset-right));top:12px}
#easy.on img{filter:drop-shadow(0 0 6px #f6c645)}
#easy.invite{animation:invite 1.1s ease-in-out infinite}
@keyframes invite{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #f6c645)}50%{transform:scale(1.08);filter:drop-shadow(0 0 10px #f6c645)}}
#jump{position:fixed;z-index:4;background-size:100% 100%;image-rendering:pixelated;pointer-events:none;opacity:.88}
#stickBase,#stickKnob{position:fixed;z-index:4;background-size:100% 100%;image-rendering:pixelated;pointer-events:none;opacity:.32;transition:opacity .15s}
#stickBase.active,#stickBase.active+#stickKnob{opacity:.8}
#hint{position:fixed;z-index:4;left:0;width:50%;bottom:0;height:40%;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#f4e2bd;font:bold 15px/1.3 -apple-system,system-ui,sans-serif;text-align:center;padding:0 18px;box-sizing:border-box;opacity:.85}
#again{position:fixed;z-index:6;left:50%;bottom:7%;transform:translateX(-50%);background:#f6c645;border:0;padding:12px 18px;box-shadow:0 0 0 4px #2a140c,inset 0 -5px 0 #b8860b,inset 0 4px 0 #fff3b0;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
#menu{position:fixed;inset:0;z-index:10;background:rgba(20,10,6,.72);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pan-y}
#menu[hidden],[hidden]{display:none!important}
#menuBox{background:#7a5236;box-shadow:0 0 0 4px #2a140c,inset 0 4px 0 #a07450,inset 0 -5px 0 #4e3220;padding:18px 18px 12px;margin:16px;max-width:420px;width:calc(100% - 32px);box-sizing:border-box}
#menuTitle{display:flex;justify-content:center;margin-bottom:12px}
.mbtn{display:flex;justify-content:center;width:100%;background:#4e3220;border:0;padding:12px 8px;margin:8px 0 4px;box-shadow:0 0 0 3px #2a140c,inset 0 3px 0 #7a5236}
.mbtn:active{transform:translateY(2px)}
.note{color:#f4e2bd;font:13px/1.35 -apple-system,system-ui,sans-serif;text-align:center;margin:2px 4px 6px;opacity:.85}
</style>
</head>
<body>
<div id="play"><canvas id="screen"></canvas></div>
<div id="deck" hidden></div>
<div id="hint" hidden>Hold the screen where you want to go</div>
<button id="easy" class="hud" aria-label="Easy mode"></button>
<button id="pause" class="hud" aria-label="Pause"></button>
<div id="jump" hidden></div>
<div id="stickBase" hidden></div><div id="stickKnob" hidden></div>
<button id="again" hidden aria-label="Play again"></button>
<div id="menu" hidden><div id="menuBox"><div id="menuTitle"></div><div id="menuItems"></div></div></div>
<script>
