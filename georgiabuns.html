<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0e0a">
<title>Georgia Buns</title>
<style>
html,body{margin:0;height:100%;background:#1a0e0a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#play{position:fixed;left:0;top:0;overflow:hidden;background:#000}
#screen{display:block;width:100%;height:100%}
#deck{position:fixed;left:0;bottom:0;width:100%;background:#4e3220;border-top:4px solid #2a140c;box-shadow:inset 0 4px 0 #7a5236;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 6px,transparent 6px 12px)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}
button{font:inherit;cursor:pointer}
.hud{position:fixed;z-index:5;border:0;padding:0;background:none;line-height:0}
#easy{left:max(12px,env(safe-area-inset-left));top:12px}
#pause{right:max(12px,env(safe-area-inset-right));top:12px}
#easy.on img{filter:drop-shadow(0 0 6px #f6c645)}
#jump{position:fixed;z-index:4;background-size:100% 100%;image-rendering:pixelated;pointer-events:none;opacity:.88}
#stickBase,#stickKnob{position:fixed;z-index:4;background-size:100% 100%;image-rendering:pixelated;pointer-events:none;opacity:.32;transition:opacity .15s}
#stickBase.active,#stickBase.active+#stickKnob{opacity:.8}
#hint{position:fixed;z-index:4;left:0;width:50%;bottom:0;height:40%;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#f4e2bd;font:bold 15px/1.3 -apple-system,system-ui,sans-serif;text-align:center;padding:0 18px;box-sizing:border-box;opacity:.85}
#again{position:fixed;z-index:6;left:50%;bottom:7%;transform:translateX(-50%);background:#f6c645;border:0;padding:12px 18px;box-shadow:0 0 0 4px #2a140c,inset 0 -5px 0 #b8860b,inset 0 4px 0 #fff3b0;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
#menu{position:fixed;inset:0;z-index:10;background:rgba(20,10,6,.72);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pan-y}
#menu[hidden],[hidden]{display:none!important}
#menuBox{background:#7a5236;box-shadow:0 0 0 4px #2a140c,inset 0 4px 0 #a07450,inset 0 -5px 0 #4e3220;padding:18px 18px 12px;margin:16px;max-width:420px;width:calc(100% - 32px);box-sizing:border-box}
#menuTitle{display:flex;justify-content:center;margin-bottom:12px}
.mbtn{display:flex;justify-content:center;width:100%;background:#4e3220;border:0;padding:12px 8px;margin:8px 0 4px;box-shadow:0 0 0 3px #2a140c,inset 0 3px 0 #7a5236}
.mbtn:active{transform:translateY(2px)}
.note{color:#f4e2bd;font:13px/1.35 -apple-system,system-ui,sans-serif;text-align:center;margin:2px 4px 6px;opacity:.85}
</style>
</head>
<body>
<div id="play"><canvas id="screen"></canvas></div>
<div id="deck" hidden></div>
<div id="hint" hidden>Hold the screen where you want to go</div>
<button id="easy" class="hud" aria-label="Easy mode"></button>
<button id="pause" class="hud" aria-label="Pause"></button>
<div id="jump" hidden></div>
<div id="stickBase" hidden></div><div id="stickKnob" hidden></div>
<button id="again" hidden aria-label="Play again"></button>
<div id="menu" hidden><div id="menuBox"><div id="menuTitle"></div><div id="menuItems"></div></div></div>
<script>

'use strict';
/* ================= Georgia Buns — art engine =================
   Everything is drawn in code at native resolution as indexed pixel
   sprites (Spr), auto-outlined, then turned into canvases per palette. */

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function hash(x, y) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16;

let RS = 7;
function srand(s) { RS = (Math.imul((s | 0) + 1, 2654435761) >>> 0) || 1; for (let i = 0; i < 8; i++) rnd(); }

    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    for (let i = 0; i < 400; i++) { this.set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  tri(ax, ay, bx, by, cx, cy, c) {

    const f = (px, py, qx, qy, rx, ry) => (qx - px) * (ry - py) - (qy - py) * (rx - px);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = x + .5, py = y + .5, a = f(ax, ay, bx, by, px, py), b = f(bx, by, cx, cy, px, py), d = f(cx, cy, ax, ay, px, py);

    }
  }
  outline(oc) {
    const n = new Uint8Array(this.d);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.d[y * this.w + x]) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) n[y * this.w + x] = oc;
    }

function palette(list) { return [null].concat(list.map(h => h ? rgb(h) : null)); }

/* ---------- bitmap font 5x7 ---------- */
const FONT = {

  E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16], G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17],
  I: [14, 4, 4, 4, 4, 4, 14], J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
  M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], P: [30, 17, 17, 30, 16, 16, 16],
  Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17], S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4],
  U: [17, 17, 17, 17, 17, 17, 14], V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
  Y: [17, 17, 10, 4, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
  0: [14, 17, 19, 21, 25, 17, 14], 1: [4, 12, 4, 4, 4, 4, 14], 2: [14, 17, 1, 2, 4, 8, 31], 3: [31, 2, 4, 2, 1, 17, 14],
  4: [2, 6, 10, 18, 31, 2, 2], 5: [31, 16, 30, 1, 1, 17, 14], 6: [6, 8, 16, 30, 17, 17, 14], 7: [31, 1, 2, 4, 8, 8, 8],
  8: [14, 17, 17, 14, 17, 17, 14], 9: [14, 17, 17, 15, 1, 2, 12],
  '.': [0, 0, 0, 0, 0, 12, 12], ',': [0, 0, 0, 0, 12, 4, 8], '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4],
  "'": [4, 4, 8, 0, 0, 0, 0], ':': [0, 12, 12, 0, 12, 12, 0], '-': [0, 0, 0, 31, 0, 0, 0], '/': [1, 1, 2, 4, 8, 16, 16],
  '+': [0, 4, 4, 31, 4, 4, 0], '(': [2, 4, 8, 8, 8, 4, 2], ')': [8, 4, 2, 2, 2, 4, 8], '&': [12, 18, 20, 8, 21, 18, 13],
  '>': [16, 8, 4, 2, 4, 8, 16], '<': [1, 2, 4, 8, 4, 2, 1], '"': [10, 10, 0, 0, 0, 0, 0]

function textW(s, sc = 1) { let w = 0; for (const ch of s) w += (ch === ' ' ? 4 : 6); return Math.max(0, w - 1) * sc; }

  s = String(s).toUpperCase();
  if (shadow) drawText(g, s, x + sc, y + sc, shadow, sc);
  g.fillStyle = col; let cx = Math.round(x); y = Math.round(y);

// outlined text: thick dark border then fill
function drawTextO(g, s, x, y, col, sc, oc, ow) {
  const o = ow || Math.min(sc, 2);

  const w = textW(s.toUpperCase(), 1) + 4, h = 11, c = mkC(w, h), g = c.getContext('2d');

/* ---------- the buns ---------- */
// palette slots: 1 outline 2 fur 3 furD 4 furL 5 cream 6 creamD 7 pink 8 white 9 black 10 nose 11 gold 12 goldD 13 goldL 14 orange 15 green 16 shades
const BUN_FURS = {
  hero: ['#a8683a', '#764022', '#d79e64'],
  gray: ['#8f919c', '#616370', '#bfc1cc'],
  tan: ['#c79c6c', '#94704a', '#e8c696'],
  dark: ['#6a4430', '#432a1c', '#8f6248'],
  white: ['#e8e1d6', '#b9b0a2', '#ffffff'],
  ginger: ['#c97a3c', '#954f20', '#eda562'],
  smoke: ['#4a4046', '#2c2529', '#6e6168'],
  honey: ['#b8863e', '#82591f', '#e0b36a']

function bunPal(fur) {
  const f = BUN_FURS[fur] || BUN_FURS.hero;
  return palette(['#2a140c', f[0], f[1], f[2], '#f4e2bd', '#d4b88c', '#ef8e94', '#ffffff', '#1a0e0a', '#d95a72', '#f6c645', '#b8860b', '#fff3b0', '#ff8a1c', '#3fb04a', '#121018']);
}
const BW = 40, BH = 46, BAX = 19, BAY = 44; // sprite size and feet anchor
function bunSpr(o) {
  const s = new Spr(BW, BH), Y = v => v + 3;
  const F = [2, 3, 4], C = [5, 6, 5], FD = [3, 3, 2];
  const hx = o.hx, hy = Y(o.hy);
  if (!o.ball) {
    s.ell(o.e2x, Y(o.e2y), 2.4, o.el2 || 7, FD, o.e2a);
    s.ell(o.bfx, Y(o.bfy), 4.4, 2.1, FD, o.bfa || 0);
    s.ell(o.tx, Y(o.ty), 3, 3, C);
    s.ell(o.bx, Y(o.by), o.brx, o.bry, F, o.ba || 0);
    s.ell(o.bx + (o.bellx || 3), Y(o.by + 1), o.brx * 0.52, o.bry * 0.7, C, o.ba || 0);
    if (o.blur) { // peel-out leg wheel
      s.ell(18, Y(38), 9, 3.6, FD);
      for (let i = 0; i < 6; i++) { const a = o.blur * 1.3 + i * 1.05; s.set(18 + Math.cos(a) * 7, Y(38) + Math.sin(a) * 2.6, 4); }

    if (o.teeth) { s.set(hx + 5, hy + 3.6, 8); s.set(hx + 5, hy + 4.6, 8); }
    if (o.mouth) { s.ell(hx + 4.6, hy + 4, 1.6, 1.4, 9); s.set(hx + 5, hy + 2.8, 8); }

const BASE = { bx: 17, by: 30, brx: 8, bry: 9, hx: 21, hy: 18, e1x: 19, e1y: 6, e1a: -0.15, e2x: 15.5, e2y: 7, e2a: -0.45, tx: 9, ty: 31, bfx: 14, bfy: 39, ffx: 23, ffy: 39, ax: 22.5, ay: 28 };

const POSES = {
  idle: [P({}), P({ eye: 'closed' })],
  walk: [0, 1, 2, 3].map(i => {

  fall: [P({ bx: 18, by: 28, brx: 7.5, bry: 9, hx: 21, hy: 17, e1x: 22, e1y: 4, e1a: 0.45, e2x: 15, e2y: 5, e2a: -0.6, bfx: 13, bfy: 38, ffx: 24, ffy: 38, ax: 27, ay: 25, aa: -1.2 })],

/* ---------- terrain prerender ---------- */
const CLAY = ['#b54a2b', '#a2401f', '#c4573a', '#953a22', '#ad4628'].map(rgb);
const GRASS_LAWN = ['#a6e870', '#7ccf4a', '#62b83a', '#4ea232', '#3f8a2a', '#33721f', '#285a18'].map(rgb);
const GRASS_FOR = ['#8fd25c', '#68b440', '#529c36', '#43862e', '#376f26', '#2c5a1e', '#224818'].map(rgb);
const BANK = ['#c9a878', '#b08c5c', '#9a7848', '#86663c', '#735632', '#634a2a', '#523c22'].map(rgb);
const BED = ['#7a8478', '#5e6a64', '#94a092', '#4c5854'].map(rgb);

function inChamber(x, y) { const dx = (x - 300) / 122, dy = (y - 362) / 34; if (dx * dx + dy * dy < 1 && y < 392) return 1; const tx = (x - 420) / 80; if (tx >= 0 && tx <= 1) { const cy = lerp(370, 302, tx); if (Math.abs(y - cy) < 9) return 2; } return 0; }
function buildTerrain() {
  const CW = TERR.CW;
  for (let cx = 0; cx < WW; cx += CW) {
    let top = 1e9; for (let x = cx; x < cx + CW; x++) top = Math.min(top, GY[Math.min(x, WW)]);
    top = Math.floor(top) - 4;
    const h = WBOT - top, c = mkC(CW, h), g = c.getContext('2d'), id = g.createImageData(CW, h), d = id.data;
    for (let i = 0; i < CW; i++) {
      const x = cx + i, gy = Math.round(GY[Math.min(x, WW)]);
      const zone = x < LAWN_END ? 0 : x < BANK_X ? 1 : (x > WATER.x0 + 30 && x < WATER.x1 - 30) ? 3 : 2;
      const GR = zone === 0 ? GRASS_LAWN : zone === 1 ? GRASS_FOR : BANK;
      for (let y = top; y < WBOT; y++) {
        const dd = y - gy; let col = null;
        if (dd < 0) {
          if (zone < 2 && dd >= -3) { const hh = hash(x, 7); const bl = hh < .35 ? 1 : hh < .6 ? 2 : hh < .7 ? 3 : 0; if (-dd <= bl) col = (-dd === bl) ? GR[0] : GR[1]; }
        } else if (zone === 3) {
          const q = y + Math.sin(x * .05) * 2; const hb = hash(x >> 2, q >> 2);
          col = dd < 2 ? BED[2] : BED[hb < .3 ? 1 : hb < .55 ? 2 : hb < .7 ? 3 : 0];
          if (hash(x, y) < .04) col = BED[2];
        } else if (dd < 7) {
          col = GR[Math.min(6, dd + (hash(x, y) < .2 ? 1 : 0))];
          if (zone === 1 && dd < 4 && hash(x * 3, y) < .09) col = rgb('#c8913a');
          if (zone === 0 && dd < 3 && hash(x, y * 5) < .03) col = rgb('#fff2a8');
        } else if (dd < 9) col = dd === 7 ? rgb('#5a2414') : rgb('#7a2e1a');
        else {
          const q = y + Math.sin(x * .021) * 3 + Math.sin(x * .0061) * 7;
          col = CLAY[((Math.floor(q / 7) % 5) + 5) % 5];
          const hh = hash(x, y);
          if (hh < .018) col = rgb('#d97a4c'); else if (hh < .03) col = rgb('#6e2814');
          if (hash(x >> 1, y >> 1) < .004) col = rgb('#e8a070');
          if (dd > 120) col = mixRGB(col, [70, 22, 12], Math.min(.5, (dd - 120) / 260));
        }
        if (dd >= 0 && x < 520) { const ch = inChamber(x, y); if (ch) { col = (y > 385 && ch === 1) ? CHAMBER_L : CHAMBER; if (ch === 1 && y < 386) { const gd = Math.hypot(x - 362, (y - 370) * 1.6); if (gd < 46) col = mixRGB(CHAMBER_GLOW, col, gd / 46); } } }
        if (!col) continue;
        const p = ((y - top) * CW + i) * 4; d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = 255;
      }
    }
    g.putImageData(id, 0, 0);

}

  const nearJump = Math.hypot(x - jcx, y - jcy) < jd * .75;
  if (UI.portrait) {
    if (y >= UI.playH) return SAVE.easy ? (nearJump || x > UI.W / 2 ? 'jump' : 'follow') : (x < UI.W / 2 ? 'stick' : 'jump');
    return SAVE.easy ? 'follow' : 'none';
  }
  if (nearJump) return 'jump';
  if (SAVE.easy) return 'follow';
  if (x > UI.W * .5 && y > UI.H * .2) return 'jump';
  if (x <= UI.W * .5 && y > UI.H * .14) return 'stick';
  return 'none';
}
function onDown(e) {
  if (paused) return;
  auUnlock();
  const z = zoneFor(e.clientX, e.clientY);
  if (z === 'tap') { IN.press = true; return; }
  if (z === 'none') return;
  const pt = { kind: z, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, kx: e.clientX, ky: e.clientY, t0: performance.now(), moved: 0 };
  if (z === 'stick') { const R = UI.stickR; pt.ox = clamp(pt.ox, R + 4, UI.W - R - 4); }
  PTR.set(e.pointerId, pt);
  if (z === 'jump') { IN.jumpP = true; $('jump').style.backgroundImage = 'url(' + ART.jumpD + ')'; }
  if (z === 'stick') placeStick(pt);
}
function onMove(e) {
  const pt = PTR.get(e.pointerId); if (!pt) return;
  pt.moved = Math.max(pt.moved, Math.hypot(e.clientX - pt.ox, e.clientY - pt.oy)); pt.x = e.clientX; pt.y = e.clientY;
  if (pt.kind === 'stick') {
    const R = UI.stickR; let dx = pt.x - pt.ox, dy = pt.y - pt.oy, d = Math.hypot(dx, dy);
    if (d > R * 1.6) { const pull = (d - R * 1.6) / d; pt.ox += dx * pull; pt.oy += dy * pull; dx = pt.x - pt.ox; dy = pt.y - pt.oy; d = Math.hypot(dx, dy); }
    const kd = Math.min(d, R); pt.kx = pt.ox + (d ? dx / d * kd : 0); pt.ky = pt.oy + (d ? dy / d * kd : 0); placeStick(pt);
  }
}
function onUp(e) {
  const pt = PTR.get(e.pointerId); if (!pt) return; PTR.delete(e.pointerId);
  if (pt.kind === 'follow' && performance.now() - pt.t0 < 240 && pt.moved < 14) IN.jumpP = true;
  if (pt.kind === 'stick') placeStick(null);
  if (pt.kind === 'jump' && ![...PTR.values()].some(p => p.kind === 'jump')) $('jump').style.backgroundImage = 'url(' + ART.jump + ')';
  auUnlock();
}
function releaseAll() { PTR.clear(); placeStick(null); $('jump').style.backgroundImage = 'url(' + ART.jump + ')'; for (const k in KEY) KEY[k] = false; }

function readInput() {
  let ix = 0, iy = 0, jump = false;
  if (KEY.ArrowLeft || KEY.KeyA) ix -= 1; if (KEY.ArrowRight || KEY.KeyD) ix += 1;
  if (KEY.ArrowUp || KEY.KeyW) iy -= 1; if (KEY.ArrowDown || KEY.KeyS) iy += 1;
  if (KEY.Space || KEY.KeyZ || KEY.KeyJ || KEY.KeyK) jump = true;
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of gps) { if (!gp) continue; const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0; if (Math.abs(ax) > .2) ix = ax; if (Math.abs(ay) > .3) iy = ay;
    if (gp.buttons[14] && gp.buttons[14].pressed) ix = -1; if (gp.buttons[15] && gp.buttons[15].pressed) ix = 1; if (gp.buttons[13] && gp.buttons[13].pressed) iy = 1; if (gp.buttons[12] && gp.buttons[12].pressed) iy = -1;
    if ((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[1] && gp.buttons[1].pressed)) jump = true; }
  const rect = disp.getBoundingClientRect();
  for (const pt of PTR.values()) {
    if (pt.kind === 'jump') jump = true;
    else if (pt.kind === 'stick') { const R = UI.stickR; let dx = (pt.x - pt.ox) / R, dy = (pt.y - pt.oy) / R; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } if (Math.abs(dx) > .12) ix = dx; if (Math.abs(dy) > .3) iy = dy; }
    else if (pt.kind === 'follow' && S && S.mode === 'play') {
      const nx = (pt.x - rect.left) / rect.width * NW + S.cam.x, ny = (Math.min(pt.y, rect.bottom) - rect.top) / rect.height * NH + S.cam.y;
      if (pt.y < rect.bottom) {
        const dx = nx - S.pl.x; ix = Math.abs(dx) < 6 ? 0 : clamp(dx / 34, -1, 1);
        if (S.pl.y - 20 - ny > 48) jump = true;
      } else ix = pt.x < UI.W / 2 ? -1 : 1;
    }
  }
  IN.ix = clamp(ix, -1, 1); IN.iy = clamp(iy, -1, 1);
  if (jump && !IN.jumpHeld) IN.jumpP = true;
  IN.jump = jump; IN.jumpHeld = jump;
}

/* ---------- loop ---------- */
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > .25) dt = .25;
  if (!paused && S) { acc += dt; let n = 0; while (acc >= 1 / 60 && n < 5) { readInput(); update(); acc -= 1 / 60; n++; } if (n >= 5) acc = 0; }
  if (S && UI.lastMode !== S.mode) layout();
  render();
  dctx.imageSmoothingEnabled = false; dctx.drawImage(scr, 0, 0, disp.width, disp.height);
}

function boot() {
  loadSave();
  buildAssets(); buildUI();
  newGame('title');
  auMode('title');
  layout();
  addEventListener('resize', () => { releaseAll(); layout(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { layout(); });
  addEventListener('orientationchange', () => { releaseAll(); setTimeout(layout, 120); });
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { releaseAll(); if (document.hidden) { if (AU.ctx) AU.ctx.suspend(); if (S && S.mode !== 'title' && S.mode !== 'cook') openMenu(); } else if (AU.ctx && SAVE.sound) AU.ctx.resume(); });
  addEventListener('pointerdown', onDown); addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
  document.addEventListener('touchend', e => { if (e.touches.length === 0) { releaseAll(); auUnlock(); } }, { passive: true });
  for (const ev of ['touchstart', 'touchmove']) document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#menu')) return; e.preventDefault(); }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  addEventListener('keydown', e => {
    auUnlock();
    if (e.code === 'Escape' || e.code === 'KeyP') { paused ? closeMenu() : openMenu(); e.preventDefault(); return; }
    if (!KEY[e.code] && (e.code === 'Enter' || e.code === 'Space')) { IN.press = true; if (S && S.mode === 'cook' && !$('again').hidden) $('again').click(); }
    KEY[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => { KEY[e.code] = false; });
  auSetOn(SAVE.sound);
  requestAnimationFrame(frame);
  window.GB = { get S() { return S; }, IN, SAVE, UI };
}
boot();

</script>
