<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIRROR OF ALGOL</title>
<style>
  html,body{margin:0;padding:0;background:#05060f;height:100%;overflow:hidden;
    font-family:"Courier New",monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .tc{position:fixed;z-index:9;opacity:.35;display:none}
  .tc div{position:absolute;background:#9db4ff;border:2px solid #fff;border-radius:8px;
    color:#0a1030;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px}
  #dpad{left:14px;bottom:14px;width:132px;height:132px}
  #btns{right:14px;bottom:24px;width:130px;height:110px}
  #bU{left:44px;top:0;width:44px;height:44px}#bD{left:44px;bottom:0;width:44px;height:44px}
  #bL{left:0;top:44px;width:44px;height:44px}#bR{right:0;top:44px;width:44px;height:44px}
  #bA{right:0;top:0;width:54px;height:54px;border-radius:50%}
  #bB{left:0;bottom:0;width:54px;height:54px;border-radius:50%}
  #dpad div{pointer-events:none}#dpad.on div{background:#9db4ff}
  #mute{right:14px;top:14px;width:44px;height:44px}
  #mute div{position:static;width:44px;height:44px;border-radius:50%;font-size:20px}

<body>
<div id="wrap"><canvas id="cv" width="320" height="224"></canvas></div>
<div id="devlink" style="display:none;position:fixed;right:8px;bottom:8px;font:11px monospace;color:#9fb4e8;background:rgba(10,14,38,0.85);border:1px solid #3a4a8a;border-radius:3px;padding:2px 7px;cursor:pointer;user-select:none;z-index:999">dev</div>
<div class="tc" id="dpad"><div id="bU">▲</div><div id="bL">◀</div><div id="bR">▶</div><div id="bD">▼</div></div>
<div class="tc" id="btns"><div id="bA">A</div><div id="bB">B</div></div>
<div class="tc" id="mute"><div id="bM">&#9834;</div></div>
<script>
"use strict";
//==================================================================
// MIRROR OF ALGOL - a science-fantasy elegy in one file
// Engine + data layout:
//   1 core helpers / input / audio    2 sprites & tiles
//   3 game data (items/techs/enemies) 4 maps & npcs
//   5 dialogue scripts                6 explore/menu/save engine
//   7 battle engine                   8 title/cutscene/endings/boot
//==================================================================
const W=320,H=224,TS=16;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function fitCanvas(){
  const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  const s2=Math.min(innerWidth/W,innerHeight/H);
  const sc=(s>=s2*0.85)?s:s2; // crisp whole-number pixels unless that would leave the game small (phones held sideways)
  cv.style.width=(W*sc)+'px';cv.style.height=(H*sc)+'px';
}
addEventListener('resize',fitCanvas);fitCanvas();
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;};

//------------------------------------------------ input
const K={u:0,d:0,l:0,r:0,a:0,b:0,m:0};
const Kp={}; // edge-press queue
function press(k){K[k]=1;Kp[k]=1;}
const KEYMAP={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',
  KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Escape:'b',KeyM:'m'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){if(!K[k])Kp[k]=1;K[k]=1;e.preventDefault();userGesture();}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){K[k]=0;e.preventDefault();}});
function jp(k){if(Kp[k]){Kp[k]=0;return true;}return false;}
function clearJP(){for(const k in Kp)Kp[k]=0;}
// touch controls
const TBTN={bA:'a',bB:'b'};
let touchShown=false;
function showTouch(){if(touchShown)return;touchShown=true;
  document.getElementById('dpad').style.display='block';
  document.getElementById('btns').style.display='block';
  document.getElementById('mute').style.display='block';}
// d-pad: one pad you can slide your thumb around, like a real one
(()=>{const pad=document.getElementById('dpad');let id=null;
  const set=d=>{for(const k of ['u','d','l','r']){const on=k===d;if(on&&!K[k])Kp[k]=1;K[k]=on?1:0;}};
  const dirOf=e=>{const r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
    if(Math.hypot(x,y)<12)return null;return Math.abs(x)>Math.abs(y)?(x>0?'r':'l'):(y>0?'d':'u');};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{pad.setPointerCapture(id);}catch(_){}pad.classList.add('on');set(dirOf(e));userGesture();});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===id)set(dirOf(e));});
  const up=e=>{if(e.pointerId!==id)return;id=null;pad.classList.remove('on');set(null);};
  pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);})();
document.getElementById('bM').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();Kp.m=1;userGesture();});
for(const id in TBTN){const el=document.getElementById(id),k=TBTN[id];
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(!K[k])Kp[k]=1;K[k]=1;userGesture();});
  el.addEventListener('pointerup',e=>{e.preventDefault();K[k]=0;});
  el.addEventListener('pointerleave',e=>{K[k]=0;});}
addEventListener('touchstart',()=>{showTouch();},{passive:true});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch')showTouch();userGesture();});

//------------------------------------------------ audio (WebAudio chiptune)
const AU={ctx:null,on:true,gain:null,seq:null,step:0,next:0,tune:null,started:false};
function userGesture(){
  if(!AU.started){AU.started=true;
    try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
      AU.gain=AU.ctx.createGain();AU.gain.gain.value=0.55;AU.gain.connect(AU.ctx.destination);
    }catch(e){AU.ctx=null;}
  }
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
}
const NF=n=>440*Math.pow(2,(n-69)/12);
function blip(freq,dur,type,vol,when,slide){
  if(!AU.ctx||!AU.on)return;
  const t=when!==undefined?when:AU.ctx.currentTime;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AU.gain);o.start(t);o.stop(t+dur+0.02);
}
const SFX={
  menu:()=>blip(880,0.06,'square',0.10),
  pick:()=>blip(1175,0.08,'square',0.10),
  cancel:()=>blip(440,0.08,'square',0.08),
  bump:()=>blip(110,0.06,'triangle',0.10),
  hit:()=>{blip(180,0.12,'square',0.16,undefined,60);},
  tech:()=>{blip(523,0.2,'sawtooth',0.10,undefined,1568);},
  heal:()=>{blip(660,0.12,'triangle',0.12);blip(990,0.16,'triangle',0.10,AU.ctx?AU.ctx.currentTime+0.1:0);},
  die:()=>blip(300,0.45,'sawtooth',0.12,undefined,40),
  chest:()=>{blip(784,0.1,'square',0.1);blip(1175,0.18,'square',0.1,AU.ctx?AU.ctx.currentTime+0.1:0);},
  scan:()=>{blip(1400,0.3,'sine',0.07,undefined,2200);},
  glitch:()=>{blip(220,0.05,'sawtooth',0.06,undefined,900);},
  save:()=>{blip(523,0.1,'triangle',0.1);blip(659,0.1,'triangle',0.1,AU.ctx?AU.ctx.currentTime+0.09:0);blip(784,0.2,'triangle',0.1,AU.ctx?AU.ctx.currentTime+0.18:0);},
  victory:()=>{const t=AU.ctx?AU.ctx.currentTime:0;[72,76,79,84].forEach((n,i)=>blip(NF(n),0.16,'square',0.1,t+i*0.12));}
};

  spire:{bpm:84,lead:[64,0,0,67,66,0,0,64,63,0,0,66,64,0,0,0, 64,0,0,67,71,0,0,70,67,0,66,0,64,0,0,0],
        bass:[40,0,40,0,39,0,39,0,38,0,38,0,40,0,40,0, 40,0,40,0,38,0,38,0,36,0,36,0,40,0,40,0]},
  finale:{bpm:66,lead:[76,0,0,0,79,0,76,0,74,0,72,0,74,0,0,0, 76,0,0,0,84,0,81,0,79,0,76,0,79,0,0,0],
        bass:[48,0,52,0,55,0,52,0,50,0,53,0,57,0,53,0, 48,0,52,0,55,0,52,0,43,0,47,0,50,0,55,0]},
  ending:{bpm:60,lead:[72,0,0,76,0,0,79,0,0,0,76,0,74,0,0,0, 72,0,0,76,0,0,81,0,79,0,0,0,76,0,0,0],
        bass:[48,0,0,0,45,0,0,0,50,0,0,0,43,0,0,0, 48,0,0,0,53,0,0,0,55,0,0,0,48,0,0,0]}
};
function playTune(name){
  if(AU.tune===name)return;
  AU.tune=name;AU.step=0;AU.next=AU.ctx?AU.ctx.currentTime+0.05:0;
}
function stopTune(){AU.tune=null;}
function audioUpdate(){
  if(!AU.ctx||!AU.on||!AU.tune)return;
  const t=TUNES[AU.tune];if(!t)return;
  const spb=60/t.bpm/2; // 8th note
  while(AU.next<AU.ctx.currentTime+0.12){
    const i=AU.step%t.lead.length;
    const ln=t.lead[i],bn=t.bass[i];
    if(ln)blip(NF(ln),spb*0.9,'square',0.045,AU.next);
    if(bn)blip(NF(bn),spb*0.95,'triangle',0.075,AU.next);
    AU.next+=spb;AU.step++;
  }
}

//==================================================================
// 2. DRAWING: text, windows, sprites, tiles
//==================================================================
// ---- crisp 5x7 bitmap font (PSII-style hard pixels, no antialiasing)
const FONT5='000000000000005F00000007000700147F147F14242A7F2A12231308646236495522500005030000001C2241000041221C00082A1C2A0808083E080800503000000808080808006060000020100804023E5149453E00427F400042615149462141454B311814127F1027454545393C4A49493001710905033649494936064949291E003636000000563600000008142241141414141441221408000201510906324979413E7E1111117E7F494949363E414141227F4141221C7F494949417F090901013E414151327F0808087F00417F41002040413F017F081422417F404040407F0204027F7F0408107F3E4141413E7F090909063E4151215E7F09192946464949493101017F01013F4040403F1F2040201F7F2018207F63140814630304780403615149454300007F4141020408102041417F000004020102044040404040000102040020545454787F484444383844444420384444487F3854545418087E090102081454543C7F0804047800447D40002040443D00007F10284400417F40007C041804787C0804047838444444387C14141408081414187C7C080404084854545420043F4440203C4040207C1C2040201C3C4030403C44281028440C5050503C4464544C44000836410000007F000000413608000804081008';
function glyph(ch){
  let k=ch.charCodeAt(0)-32;
  if(k<0||k>94)k=31; // '?'
  const o=k*10,out=[];
  for(let c2=0;c2<5;c2++)out.push(parseInt(FONT5.substr(o+c2*2,2),16));
  return out;
}
function txtRaw(s,x,y,c,sc){
  ctx.fillStyle=c;
  x=Math.round(x);y=Math.round(y);
  for(let i2=0;i2<s.length;i2++){
    const g=glyph(s[i2]);
    for(let cx=0;cx<5;cx++){
      const bits=g[cx];
      for(let ry=0;ry<7;ry++)if(bits&(1<<ry))ctx.fillRect(x+cx*sc,y+ry*sc,sc,sc);
    }
    x+=6*sc;
  }
}
function txt(s,x,y,c,size){
  s=String(s);
  const sc=(size&&size>=10)?2:1;
  txtRaw(s,x+sc,y+sc,'rgba(0,0,0,0.85)',sc);
  txtRaw(s,x,y,c||'#fff',sc);
}
function txtW(s,size){return String(s).length*6*((size&&size>=10)?2:1)-((size&&size>=10)?2:1);}
function txtC(s,x,y,c,size){
  txt(s,x-txtW(s,size)/2,y,c,size);
}
function win(x,y,w,h,opt){
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(x+3,y+3,w,h);
  // metallic beveled frame, PSII style
  ctx.fillStyle='#f0f2f6';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#565c6c';ctx.fillRect(x+1,y+1,w-1,h-1);
  ctx.fillStyle='#a8aeba';ctx.fillRect(x+1,y+1,w-2,h-2);
  ctx.fillStyle='#caced8';ctx.fillRect(x+1,y+1,w-2,1);ctx.fillRect(x+1,y+1,1,h-2);
  ctx.fillStyle='#262b3c';ctx.fillRect(x+3,y+3,w-5,h-5);
  ctx.fillStyle=(opt&&opt.bg)||'#1d2492';
  ctx.fillRect(x+4,y+4,w-8,h-8);
}
// ---- character sprite (procedural, 4 dirs, 2-frame walk)
// pal: {hair, skin, top, bottom}
function drawChar(x,y,dir,frame,pal,glitch){
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(x+3,y+14,10,2);
  const bob=frame?1:0;
  const gx=glitch?ri(-1,1):0;
  const X=x+gx,Y=y+bob;
  const dk=c=>{const n=parseInt(c.slice(1),16);
    return 'rgb('+Math.max(0,(n>>16)-52)+','+Math.max(0,((n>>8)&255)-52)+','+Math.max(0,(n&255)-52)+')';};
  const lt=c=>{const n=parseInt(c.slice(1),16);
    return 'rgb('+Math.min(255,(n>>16)+56)+','+Math.min(255,((n>>8)&255)+56)+','+Math.min(255,(n&255)+56)+')';};
  ctx.fillStyle='#0a0a14';
  ctx.fillRect(X+3,Y-3,10,18);
  ctx.fillStyle=pal.bottom;
  if(frame){ctx.fillRect(X+4,Y+9,3,5);ctx.fillRect(X+9,Y+10,3,4);}
  else{ctx.fillRect(X+4,Y+10,3,4);ctx.fillRect(X+9,Y+9,3,5);}
  ctx.fillStyle=dk(pal.bottom);ctx.fillRect(X+7,Y+9,1,4);
  ctx.fillStyle='#1a1424';
  ctx.fillRect(X+4,Y+13,3,2);ctx.fillRect(X+9,Y+13,3,2);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(X+4,Y+13,1,1);ctx.fillRect(X+9,Y+13,1,1);
  ctx.fillStyle=pal.top;ctx.fillRect(X+4,Y+4,8,4);
  ctx.fillStyle=dk(pal.top);ctx.fillRect(X+4,Y+6,8,2);
  ctx.fillStyle=lt(pal.top);ctx.fillRect(X+5,Y+4,3,1);
  ctx.fillStyle='#14101e';ctx.fillRect(X+4,Y+8,8,1);
  ctx.fillStyle='#e8d44a';ctx.fillRect(X+7,Y+8,2,1);
  const sw=frame?1:0;
  ctx.fillStyle=dk(pal.top);
  if(dir==='l'){ctx.fillRect(X+3,Y+4+sw,2,3);}
  else if(dir==='r'){ctx.fillRect(X+11,Y+5-sw,2,3);}
  else{ctx.fillRect(X+3,Y+4+sw,2,3);ctx.fillRect(X+11,Y+5-sw,2,3);}
  ctx.fillStyle=pal.skin;
  if(dir==='l')ctx.fillRect(X+3,Y+6+sw,2,1);
  else if(dir==='r')ctx.fillRect(X+11,Y+7-sw,2,1);
  else{ctx.fillRect(X+3,Y+6+sw,2,1);ctx.fillRect(X+11,Y+7-sw,2,1);}
  ctx.fillStyle=pal.skin;ctx.fillRect(X+5,Y-2,6,6);
  ctx.fillStyle=dk(pal.skin);ctx.fillRect(X+5,Y+3,6,1);
  ctx.fillStyle=pal.hair;
  ctx.fillRect(X+4,Y-3,8,2);
  ctx.fillRect(X+4,Y-1,2,4);ctx.fillRect(X+10,Y-1,2,4);
  if(dir==='u')ctx.fillRect(X+5,Y-1,6,4);
  else{ctx.fillRect(X+5,Y-1,1,1);ctx.fillRect(X+10,Y-1,1,1);}
  ctx.fillStyle=dk(pal.hair);
  ctx.fillRect(X+4,Y+2,2,1);ctx.fillRect(X+10,Y+2,2,1);
  ctx.fillStyle=lt(pal.hair);ctx.fillRect(X+5,Y-3,3,1);
  if(dir!=='u'){
    ctx.fillStyle='#1a1430';
    if(dir==='d'){ctx.fillRect(X+6,Y,1,1);ctx.fillRect(X+9,Y,1,1);
      ctx.fillStyle='rgba(160,80,90,0.8)';ctx.fillRect(X+7,Y+2,2,1);}
    else if(dir==='l'){ctx.fillRect(X+6,Y,1,1);ctx.fillStyle=dk(pal.skin);ctx.fillRect(X+5,Y+1,1,1);}
    else{ctx.fillRect(X+9,Y,1,1);ctx.fillStyle=dk(pal.skin);ctx.fillRect(X+10,Y+1,1,1);}
  }
  if(glitch){
    ctx.fillStyle='rgba(159,232,255,0.55)';
    ctx.fillRect(X+2,Y+ri(-2,11),12,1);
    ctx.fillStyle='rgba(232,74,192,0.4)';
    ctx.fillRect(X+ri(0,4),Y+ri(-2,11),8,1);
  }
}
const PAL_ALYS={hair:'#e8b04a',skin:'#f2c9a0',top:'#3b6fd4',bottom:'#cfd6ff'};
const PAL_TEIN={hair:'#5a4632',skin:'#d8a878',top:'#7a3030',bottom:'#3a3a4a'};
const PAL_MARA={hair:'#76e0c8',skin:'#f0c8b0',top:'#2e7a5a',bottom:'#1f2a40'};
function npcPal(seed){
  const hues=[['#888','#e8c8a8','#556','#334'],['#c45','#e8c8a8','#864','#433'],
    ['#357','#d8b090','#575','#243'],['#aa6','#f0d0b0','#747','#323'],
    ['#ddd','#e0b898','#446','#225'],['#a52','#d8a878','#285','#142']];
  const h=hues[seed%hues.length];
  return {hair:h[0],skin:h[1],top:h[2],bottom:h[3]};
}
// ---- portraits (32x32 busts)
const PORT_CFG={

function eDk(c,n){const v=parseInt(c.slice(1),16);return 'rgb('+Math.max(0,(v>>16)-n)+','+Math.max(0,((v>>8)&255)-n)+','+Math.max(0,(v&255)-n)+')';}
function eLt(c,n){const v=parseInt(c.slice(1),16);return 'rgb('+Math.min(255,(v>>16)+n)+','+Math.min(255,((v>>8)&255)+n)+','+Math.min(255,(v&255)+n)+')';}

// ---- pixel-art sprite engine: palette-indexed bitmap grids, scaled with crisp pixels
function drawPix(x,y,scale,pal,grid){
  // grid: array of strings; each char is a key into pal (' ' or '.' = transparent)
  for(let r=0;r<grid.length;r++){
    const row=grid[r];
    for(let cN=0;cN<row.length;cN++){
      const ch=row[cN];
      if(ch===' '||ch==='.')continue;
      const col=pal[ch];if(!col)continue;
      ctx.fillStyle=col;
      ctx.fillRect(x+cN*scale,y+r*scale,scale,scale);
    }
  }
}
// auto-outline: draws a 1px dark edge around any non-transparent pixel that touches transparency
function drawPixOutlined(x,y,scale,pal,grid,outline){
  const H=grid.length,Wd=Math.max(...grid.map(r=>r.length));
  const at=(r,c)=>{const row=grid[r];if(!row)return ' ';const ch=row[c]||' ';return (ch===' '||ch==='.')?' ':ch;};
  ctx.fillStyle=outline||'#0a0a12';
  for(let r=0;r<H;r++)for(let c=0;c<Wd;c++){
    if(at(r,c)!==' ')continue;
    // transparent cell adjacent to a solid one becomes outline
    if(at(r-1,c)!==' '||at(r+1,c)!==' '||at(r,c-1)!==' '||at(r,c+1)!==' '){
      ctx.fillRect(x+c*scale,y+r*scale,scale,scale);
    }
  }
  drawPix(x,y,scale,pal,grid);
}

// = path | C heal crystal | L l-switch | R r-switch | G locked gate | * sparkle floor
const SOLID={'#':1,'~':1,'T':1,'B':1,'b':1,'G':1,'D':1};
function drawTile(ch,sx,sy,pal,tx,ty,t,rows){
  const nb=(dx,dy)=>{if(!rows)return ch;const r=rows[ty+dy];return r?(r[tx+dx]||'#'):'#';};
  const grassTile=()=>{
    ctx.fillStyle=pal.fl;ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle=pal.fl2;
    for(let k=0;k<4;k++){
      ctx.fillRect(sx+((k*4+2)%16),sy+2+k*4,2,2);
      ctx.fillRect(sx+((k*4+10)%16),sy+k*4,2,2);
    }
    ctx.fillStyle=pal.fl3;
    for(let k=0;k<3;k++)ctx.fillRect(sx+((k*6+4+(ty%2)*3)%14),sy+3+k*5,2,1);
    if(hash(tx*5,ty*5)>0.94){ctx.fillStyle=pal.hi;ctx.fillRect(sx+9,sy+5,2,1);}
  };
  const paverTile=()=>{
    // PSII paved plaza: gray interlocking plates with grass tufts in seams
    ctx.fillStyle=pal.path;ctx.fillRect(sx,sy,TS,TS);
    const fz=(tx+ty)%2;
    ctx.fillStyle=pal.pathD;
    ctx.fillRect(sx,sy+7,TS,1);
    if(fz){ctx.fillRect(sx+7,sy,1,8);ctx.fillRect(sx+3,sy+3,5,1);
      ctx.fillRect(sx+11,sy+8,1,8);ctx.fillRect(sx+6,sy+12,6,1);}
    else{ctx.fillRect(sx+11,sy,1,8);ctx.fillRect(sx+5,sy+3,7,1);
      ctx.fillRect(sx+3,sy+8,1,8);ctx.fillRect(sx+3,sy+12,8,1);}
    ctx.fillStyle='#cdd2d8';
    ctx.fillRect(sx,sy,TS,1);ctx.fillRect(sx+(fz?8:0),sy+8,8,1);
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.fillRect(sx+2+(fz?6:0),sy+5,4,1);ctx.fillRect(sx+(fz?2:9),sy+14,4,1);
    // sparse grass tuft pushing through a seam
    if(hash(tx*7,ty*3)>0.86){ctx.fillStyle=pal.fl;ctx.fillRect(sx+(fz?6:11),sy+9,2,2);
      ctx.fillStyle=pal.fl3;ctx.fillRect(sx+(fz?7:12),sy+8,1,1);}
  };
  const floorBase=()=>{pal.town?paverTile():grassTile();};
  switch(ch){
    case'.':{floorBase();break;}
    case',':{floorBase();
      ctx.fillStyle=pal.decoD;ctx.fillRect(sx+4,sy+6,1,3);ctx.fillRect(sx+10,sy+9,1,3);
      ctx.fillStyle=pal.deco;ctx.fillRect(sx+3,sy+5,3,2);ctx.fillRect(sx+9,sy+8,3,2);
      ctx.fillRect(sx+12,sy+3,2,2);break;}
    case'*':{floorBase();
      const ph=Math.floor(t*3+tx+ty)%4;
      const cxp=sx+4+((tx*7)%8),cyp=sy+4+((ty*5)%8);
      ctx.fillStyle=pal.hi;
      ctx.fillRect(cxp,cyp-1-ph%2,1,3+ph%2*2);ctx.fillRect(cxp-1-ph%2,cyp,3+ph%2*2,1);
      ctx.fillStyle='#fff';ctx.fillRect(cxp,cyp,1,1);break;}
    case'=':{
      ctx.fillStyle=pal.path;ctx.fillRect(sx,sy,TS,TS);
      const fz=(tx+ty)%2;
      ctx.fillStyle=pal.pathD;
      ctx.fillRect(sx,sy+7,TS,1);
      if(fz){ctx.fillRect(sx+7,sy,1,4);ctx.fillRect(sx+3,sy+3,1,5);ctx.fillRect(sx+3,sy+3,5,1);
        ctx.fillRect(sx+11,sy+8,1,5);ctx.fillRect(sx+6,sy+12,6,1);ctx.fillRect(sx+6,sy+12,1,4);}
      else{ctx.fillRect(sx+11,sy,1,4);ctx.fillRect(sx+5,sy+3,7,1);ctx.fillRect(sx+5,sy+3,1,5);
        ctx.fillRect(sx+8,sy+8,1,5);ctx.fillRect(sx+8,sy+12,7,1);ctx.fillRect(sx+14,sy+12,1,4);}
      ctx.fillStyle='#cdd2d8';
      ctx.fillRect(sx,sy,TS,1);ctx.fillRect(sx+(fz?8:0),sy+8,8,1);
      ctx.fillStyle='rgba(0,0,0,0.10)';
      ctx.fillRect(sx+2+(fz?6:0),sy+5,4,1);ctx.fillRect(sx+(fz?2:9),sy+14,4,1);
      break;}
    case'#':{
      ctx.fillStyle=pal.wall;ctx.fillRect(sx,sy,TS,TS);
      const openUp=!SOLID[nb(0,-1)]||nb(0,-1)==='~';
      // top cap when exposed above
      ctx.fillStyle=pal.wallT;ctx.fillRect(sx,sy,TS,5);
      ctx.fillStyle=pal.wallHi;ctx.fillRect(sx,sy,TS,1);
      // brick courses on the face
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.fillRect(sx,sy+9,TS,1);ctx.fillRect(sx,sy+13,TS,1);
      ctx.fillRect(sx+((tx%2)?4:10),sy+5,1,4);ctx.fillRect(sx+((tx%2)?12:6),sy+10,1,3);
      ctx.fillStyle='rgba(255,255,255,0.07)';
      ctx.fillRect(sx+2,sy+6,4,1);ctx.fillRect(sx+8,sy+10,5,1);
      if(!SOLID[nb(0,1)]){ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fillRect(sx,sy+15,TS,1);}
      break;}
    case'~':{
      ctx.fillStyle=pal.wat;ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle=pal.watD;
      for(let k=0;k<4;k++){
        ctx.fillRect(sx+((k*4+(ty%2)*2)%16),sy+1+k*4,2,2);
        ctx.fillRect(sx+((k*4+8+(ty%2)*2)%16),sy+3+k*4,2,2);
      }
      const o=Math.floor(t*3+tx*0.7+ty)%4;
      ctx.fillStyle=pal.watHi;
      ctx.fillRect(sx+1+o*3,sy+2,3,1);ctx.fillRect(sx+13-o*3,sy+9,3,1);
      ctx.fillRect(sx+6+o,sy+13,2,1);
      ctx.fillStyle='#fff';
      if((tx+ty+Math.floor(t*2))%5===0)ctx.fillRect(sx+4+o*2,sy+6,2,1);
      // shoreline banks against non-water neighbors
      const bank=pal.town?pal.pathD:pal.decoD, bankL=pal.town?pal.path:pal.fl3;
      const U=nb(0,-1),D2=nb(0,1),Ln=nb(-1,0),Rn=nb(1,0);

// xp curve
const xpNext=lvl=>30+8*lvl*lvl;
const LEARN={ // level: techs gained
  alys:{1:['refoi'],3:['nares'],6:['brose'],9:['gires']},
  tein:{2:['crash'],5:['warla']},
  mara:{4:['nares'],5:['saner'],7:['nafoi']}
};
function mkMember(id){
  const base={
    alys:{n:'Alys',hp:34,tp:12,atk:6,df:3,spd:8,pal:PAL_ALYS,port:'alys'},
    tein:{n:'Tein',hp:44,tp:8,atk:8,df:4,spd:6,pal:PAL_TEIN,port:'tein'},
    mara:{n:'Mara',hp:30,tp:16,atk:5,df:3,spd:11,pal:PAL_MARA,port:'mara'}
  }[id];
  const m={id,n:base.n,lvl:1,xp:0,
    maxhp:base.hp,hp:base.hp,maxtp:base.tp,tp:base.tp,
    batk:base.atk,bdf:base.df,spd:base.spd,
    weapon:'rusted',armor:'cloth',acc:'none',
    techs:[],pal:base.pal,port:base.port,defending:false,buff:0,haste:0};
  applyLearn(m);return m;
}
function applyLearn(m){
  const L=LEARN[m.id]||{};
  for(let l=1;l<=m.lvl;l++)if(L[l])L[l].forEach(t=>{if(!m.techs.includes(t))m.techs.push(t);});
}
const mATK=m=>m.batk+m.lvl*2+WEAPONS[m.weapon].atk;
const mDEF=m=>m.bdf+m.lvl+ARMORS[m.armor].def+(m.acc==='wcore'?4:0);
function gainXP(m,xp){
  if(m.hp<=0)return [];
  m.xp+=xp;const ups=[];
  while(m.lvl<12&&m.xp>=xpNext(m.lvl)){
    m.xp-=xpNext(m.lvl);m.lvl++;
    m.maxhp+=8;m.maxtp+=3;m.hp=Math.min(m.maxhp,m.hp+8);m.tp=Math.min(m.maxtp,m.tp+3);
    const before=m.techs.length;applyLearn(m);
    ups.push({n:m.n,lvl:m.lvl,learned:m.techs.slice(before)});
  }
  return ups;
}

const POPS=[],FXS=[];
function pop(x,y,txt,c){POPS.push({x,y,txt:String(txt),c,t:0.95});}
function fx(k,x,y,c){
  if(k==='shatter'){
    for(let i=0;i<14;i++)FXS.push({k:'pix',x,y,c,t:0.7,
      vx:rnd(-55,55),vy:rnd(-80,-10),g:160});
  }else if(k==='heal'){
    for(let i=0;i<7;i++)FXS.push({k:'pix',x:x+rnd(-16,16),y:y+rnd(-2,6),c:'#8fe8a0',t:0.7,vx:rnd(-6,6),vy:rnd(-46,-22),g:0});
  }else FXS.push({k,x,y,c,t:0.3});
}
function epx(e){return (e._sx!==undefined?e._sx:W/2-28)+28;}
function epy(e){return (e._sy!==undefined?e._sy:40)+30;}
function ppx(m){return 120+G.party.indexOf(m)*80;}
function ppy(m){return 168;}
function fxUpdate(dt){
  for(let i=POPS.length-1;i>=0;i--){const p=POPS[i];p.t-=dt;p.y-=dt*26;if(p.t<=0)POPS.splice(i,1);}
  for(let i=FXS.length-1;i>=0;i--){const f=FXS[i];f.t-=dt;
    if(f.k==='pix'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g||0)*dt;}
    if(f.t<=0)FXS.splice(i,1);}
  if(BT.tflash&&BT.tflash.t>0)BT.tflash.t-=dt;
  if(BT.anim&&BT.anim.t>0)BT.anim.t-=dt;
}
function fxDraw(){
  FXS.forEach(f=>{
    if(f.k==='pix'){ctx.fillStyle=f.c;ctx.globalAlpha=Math.min(1,f.t*2);
      ctx.fillRect(f.x|0,f.y|0,2,2);ctx.globalAlpha=1;}
    else if(f.k==='slash'){
      const p=1-f.t/0.3,r=6+p*16;
      ctx.strokeStyle='rgba(255,255,255,'+(1-p)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(f.x-r,f.y-r*0.6);ctx.lineTo(f.x+r,f.y+r*0.6);
      ctx.moveTo(f.x+r,f.y-r*0.6);ctx.lineTo(f.x-r,f.y+r*0.6);ctx.stroke();ctx.lineWidth=1;
    }else if(f.k==='bolt'){
      const segs=7;
      ctx.globalAlpha=Math.min(1,f.t*4);
      for(let pass=0;pass<2;pass++){
        ctx.strokeStyle=pass?'#5a78ff':'#dfe9ff';ctx.lineWidth=pass?1:2;
        ctx.beginPath();ctx.moveTo(f.x1,f.y1);
        for(let i2=1;i2<segs;i2++){
          const fr=i2/segs;
          ctx.lineTo(f.x1+(f.x2-f.x1)*fr+ri(-6,6),f.y1+(f.y2-f.y1)*fr+ri(-5,5));
        }
        ctx.lineTo(f.x2,f.y2);ctx.stroke();
      }
      ctx.lineWidth=1;ctx.globalAlpha=1;
    }else if(f.k==='burst'){
      const p=1-f.t/0.3,r=4+p*18;
      ctx.strokeStyle=f.c;ctx.globalAlpha=1-p;
      ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.stroke();
      ctx.beginPath();ctx.arc(f.x,f.y,r*0.55,0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
  POPS.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.t*2.5);
    txtC(p.txt,p.x,p.y,p.c,10);
    ctx.globalAlpha=1;
  });
}
// ---- ambient particles for explore scenes
const AMB=[];let ambLast=0;
const AMB_CFG={camineet:{n:10,k:'mote'},sands:{n:18,k:'streak'},vault:{n:10,k:'mote'},
  lake:{n:10,k:'mote'},wastes:{n:26,k:'static'},spire1:{n:14,k:'rise'},
  spire2:{n:14,k:'rise'},spire3:{n:20,k:'rise'}};
function ambUpdate(t){
  const dt=clamp(t-ambLast,0,0.1);ambLast=t;
  const cfg=AMB_CFG[G.map]||{n:8,k:'mote'};
  const c=ZPAL[MAPS[G.map].pal].amb;
  while(AMB.length<cfg.n)AMB.push({x:rnd(0,W),y:rnd(0,H),vx:0,vy:0,p:rnd(0,6),k:cfg.k,c});
  while(AMB.length>cfg.n)AMB.pop();
  AMB.forEach(a=>{
    a.k=cfg.k;a.c=c;a.p+=dt;
    if(a.k==='streak'){a.x-=dt*60;a.y+=Math.sin(a.p*3)*dt*8;if(a.x<-4){a.x=W+4;a.y=rnd(0,H);}}
    else if(a.k==='static'){if(Math.random()<dt*9){a.x=rnd(0,W);a.y=rnd(0,H);}}
    else if(a.k==='rise'){a.y-=dt*14;a.x+=Math.sin(a.p*1.5)*dt*6;if(a.y<-4){a.y=H+4;a.x=rnd(0,W);}}
    else{a.x+=Math.sin(a.p)*dt*7;a.y+=Math.cos(a.p*0.7)*dt*5;
      if(a.x<0)a.x=W;if(a.x>W)a.x=0;if(a.y<0)a.y=H;if(a.y>H)a.y=0;}
  });
}
function ambDraw(){
  AMB.forEach(a=>{
    if(a.k==='static'){ctx.globalAlpha=0.5;ctx.fillStyle=Math.random()<0.5?a.c:'#fff';
      ctx.fillRect(a.x|0,a.y|0,1,1);}
    else if(a.k==='streak'){ctx.globalAlpha=0.30;ctx.fillStyle=a.c;ctx.fillRect(a.x|0,a.y|0,4,1);}
    else{ctx.globalAlpha=0.30+Math.sin(a.p*2)*0.18;ctx.fillStyle=a.c;ctx.fillRect(a.x|0,a.y|0,1,1);}
  });
  ctx.globalAlpha=1;
}
function lerpC(a,b,f){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=((pa>>16)+(((pb>>16)-(pa>>16))*f))|0;
  const g=(((pa>>8)&255)+((((pb>>8)&255)-((pa>>8)&255))*f))|0;
  const bl=((pa&255)+(((pb&255)-(pa&255))*f))|0;
  return 'rgb('+r+','+g+','+bl+')';
}

let mapCache={name:'',rows:null,stamp:-1};
let frameStamp=0;
function mapRows(name){
  if(mapCache.name===name&&mapCache.stamp===frameStamp)return mapCache.rows;
  const m=MAPS[name],rows=m.rows.slice();
  if(m.dyn)m.dyn(rows);
  mapCache={name,rows,stamp:frameStamp};
  return rows;
}
function tileAt(name,x,y){
  const rows=mapRows(name);
  if(y<0||y>=rows.length||x<0||x>=rows[0].length)return '#';
  return rows[y][x];
}
function npcAt(x,y){
  return MAPS[G.map].npcs.find(n=>n.x===x&&n.y===y&&!(n.hide&&n.hide()));
}
function objAt(x,y){
  return (MAPS[G.map].objects||[]).find(o=>o.x===x&&o.y===y&&!(o.type==='chest'&&G.opened[o.id]));
}
function enemyAt(x,y){
  return (MAPS[G.map].enemies||[]).find(e=>e.x===x&&e.y===y&&!D(e.id));
}
function blocked(x,y){
  if(SOLID[tileAt(G.map,x,y)])return true;
  if(npcAt(x,y))return true;
  const o=objAt(x,y);if(o&&o.type!=='none')return true;
  return false;
}
function enterMap(name,x,y,silent){
  // ordinary enemies come back when you return to an area (bosses stay beaten), so there's always a way to level up
  if(name!==G.map)(MAPS[name].enemies||[]).forEach(e=>{if(!e.boss)delete G.defeated[e.id];});
  G.map=name;G.px=x;G.py=y;G.moving=0;G.mx=0;G.my=0;
  mapCache.stamp=-1;
  const m=MAPS[name];
  playTune(m.music);
  if(!silent){zoneBanner={s:m.name,t:2.2};autosave();}
}
let zoneBanner=null;
const DIRV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function exploreUpdate(dt){
  if(G.moving>0){
    G.moving-=dt*5.5;
    if(G.moving<=0){G.moving=0;G.mx=0;G.my=0;onStep();}
    return;
  }
  if(jp('a')){interact();clearJP();return;}
  if(jp('b')){
    const [fx,fy]=DIRV[G.dir];
    if(F('sense')&&npcAt(G.px+fx,G.py+fy))fieldSense();else openMenu();
    clearJP();return;}
  let d=null;
  if(K.u)d='u';else if(K.d)d='d';else if(K.l)d='l';else if(K.r)d='r';
  if(!d)return;
  G.dir=d;
  const [dx,dy]=DIRV[d],nx=G.px+dx,ny=G.py+dy;
  const en=enemyAt(nx,ny);
  if(en){startBattle(en.g,{mapEnemy:en});return;}
  if(blocked(nx,ny)){
    const t=tileAt(G.map,nx,ny);
    if(t==='G'&&jpAnyDir())gateMessage();
    if(t==='D'&&!npcAt(nx,ny)){useDoor();clearJP();}
    return;
  }
  G.px=nx;G.py=ny;G.mx=-dx;G.my=-dy;G.moving=1;G.steps++;
}
let lastGateMsg=0;
function jpAnyDir(){return true;}
function gateMessage(){
  if(perfNow-lastGateMsg<900)return;lastGateMsg=perfNow;
  const msgs={camineet:'The east gate is sealed. (Speak with Elder Noor.)',
    lake:'The east gate is sealed. Keeper Veth watches it.',
    vault:'Sealed. Somewhere, a switch room hums.',
    sands:'The way north is barred from the other side.'};
  toast(msgs[G.map]||'It does not move.');SFX.bump();
}
function onStep(){
  const m=MAPS[G.map];
  for(const ex of (m.exits||[])){
    if(ex.x===G.px&&ex.y===G.py){enterMap(ex.to,ex.tx,ex.ty);return;}
  }
  for(const tr of (m.triggers||[])){
    if(tr.x===G.px&&tr.y===G.py){fireTrigger(tr);return;}
  }
}
function fireTrigger(tr){
  switch(tr.type){
    case 'vaultdoor':
      if(hasItem('vaultkey')){toast('The Vault Key hums. The doors part.');SFX.scan();enterMap('vault',3,11);}
      else toast('Doors of sand-scoured metal. They want a key.');
      break;
    case 'searose':
      if(F('fetch_started')&&!F('searose_checked'))runDlg('searose');
      break;
    case 'marascene':
      if(F('mara_joined')&&!F('mara_revealed'))runDlg('mara_reveal');
      break;
    case 'spiredoor':
      if(hasItem('spirekey')){toast('The Spire Key turns once, soundlessly.');SFX.scan();enterMap('spire1',7,9);}
      else toast('The Silver Spire is sealed. Something cold should fit here.');
      break;
    case 'apex':
      if(!D('sp3')){toast('The Archive Guardian bars the light.');SFX.bump();break;}
      if(!F('apex_seen'))runDlg('apex');
      else if(!F('finale_started')){setF('finale_started');runDlg('prefinal');}
      break;
  }
}
function interact(){
  const [dx,dy]=DIRV[G.dir],tx=G.px+dx,ty=G.py+dy;
  const n=npcAt(tx,ty);
  if(n){SFX.menu();const did=n.d();if(!DLG[did]&&SHOPS[did]){openShop(did);return;}runDlg(did);return;}
  const en=enemyAt(tx,ty);
  if(en){startBattle(en.g,{mapEnemy:en});return;}
  const o=objAt(tx,ty);
  if(o){
    if(o.type==='chest'){
      G.opened[o.id]=1;SFX.chest();
      if(o.item){
        if(WEAPONS[o.item]){G.stash.push(['w',o.item]);toast('Found '+WEAPONS[o.item].n+'!');}
        else if(ARMORS[o.item]){G.stash.push(['a',o.item]);toast('Found '+ARMORS[o.item].n+'!');}
        else{addItem(o.item);toast('Found '+ITEMS[o.item].n+'!');}
      }else if(o.gold){addGold(o.gold);toast('Found '+o.gold+' meseta!');}
      return;
    }
    if(o.type==='crystal'){healAll();SFX.heal();toast('The crystal restores the party. Progress saved.');autosave();return;}
    if(o.type==='terminal'){runDlg(o.d);return;}
    if(o.type==='boathouse'){runDlg('boathouse');return;}
  }
  const t=tileAt(G.map,tx,ty);
  if(t==='R'){setF('sw_r');SFX.menu();toast('A blue switch sinks with a click.');return;}
  if(t==='L'){
    if(F('sw_r')&&!F('vault_gate')){setF('vault_gate');SFX.scan();toast('Far off, a gate grinds open!');}
    else if(!F('vault_gate')){G.flags.sw_r=0;SFX.bump();toast('A hum, then silence. Order matters.');}
    return;
  }
  if(t==='G')gateMessage();
  if(t==='D'){useDoor();return;}
}
// a building door: a shop in town, the Silver Spire in the Wastes
function useDoor(){
  if(G.map==='wastes'){fireTrigger({type:'spiredoor'});return;}
  const sid=({camineet:'shop_cam',lake:'shop_lake'})[G.map];
  if(sid){SFX.menu();openShop(sid);}
}
// field Mirror Sense: press B adjacent to a person
function fieldSense(){
  if(!F('sense'))return;
  const [dx,dy]=DIRV[G.dir];
  const target=npcAt(G.px+dx,G.py+dy);
  if(!target){toast('Mirror Sense needs someone close.');return;}
  const alys=G.party[0];
  const free=G.party.some(m=>m.acc==='truthlens');
  if(!free){
    if(alys.tp<2){toast('Not enough TP.');return;}
    alys.tp-=2;
  }
  SFX.scan();
  const res=target.rep?
    'REPLICANT. Reconstruction running. Source entry: archived.':
    'HUMAN. Uploaded mind, original pattern intact.';
  DLG._sense=[{t:'MIRROR SENSE: '+target.n+'...'},{t:res},
    target.rep?{do:()=>SFX.glitch()}:{do:()=>{}}];
  runDlg('_sense');
}

const DL={script:null,idx:0,choice:0,choices:null,after:null,shopId:null};
function runDlg(id){
  const s=DLG[id];if(!s)return;
  DL.script=s;DL.idx=-1;DL.choices=null;
  G.state='DIALOGUE';
  dlgAdvance();
}
function dlgFindLabel(l){
  for(let i=0;i<DL.script.length;i++)if(DL.script[i].label===l)return i;
  return DL.script.length;
}
function dlgAdvance(){
  while(true){
    if(!DL.script)return;
    DL.idx++;
    if(DL.idx>=DL.script.length){endDlg();return;}
    const st=DL.script[DL.idx];
    if(st.label!==undefined)continue;
    if(st.do){st.do();continue;}
    if(st.if){if(st.if())DL.idx=dlgFindLabel(st.jump)-0;continue;}
    if(st.jump!==undefined&&!st.if){DL.idx=dlgFindLabel(st.jump);continue;}
    if(st.end){endDlg();return;}
    if(st.battle){
      const b=st.battle;
      G.state='EXPLORE';DL.script=null;
      startBattle(b.g,{after:b.after,guest:b.guest});
      return;
    }
    if(st.shop){openShop(st.shop);return;}
    if(st.choice){DL.choices=st.choice;DL.choice=0;return;}
    // text step ({t} or {s,t} or {dynline})
    return;
  }
}
function endDlg(){DL.script=null;if(G.state==='DIALOGUE')G.state='EXPLORE';clearJP();}
function dlgUpdate(){
  if(!DL.script)return;
  if(DL.choices){
    if(jp('u')){DL.choice=(DL.choice+DL.choices.length-1)%DL.choices.length;SFX.menu();}
    if(jp('d')){DL.choice=(DL.choice+1)%DL.choices.length;SFX.menu();}
    if(jp('a')){
      SFX.pick();
      const c=DL.choices[DL.choice];DL.choices=null;
      DL.idx=dlgFindLabel(c.j);
      dlgAdvance();
    }
    return;
  }
  if(jp('a')){SFX.menu();dlgAdvance();}
}
function dlgDraw(){
  if(!DL.script)return;
  const st=DL.script[DL.idx];if(!st)return;
  const hasP=st.s&&st.p;
  win(4,160,312,60);
  let tx0=12;
  if(hasP){drawPortrait(6,150,st.p);tx0=66;}
  const speaker=st.s?(st.s):null;
  if(speaker){
    txt(speaker,tx0,166,'#9fe8ff');
    ctx.fillStyle='rgba(159,232,255,0.45)';
    ctx.fillRect(tx0,175,Math.min(90,speaker.length*5+8),1);
  }
  const body=st.dynline?D2.line:(st.t||'');
  wrapTxt(body,tx0,speaker?179:169,306-tx0,'#fff',11);
  if(!DL.choices)txt(touchShown?'A':'Z',304,210,'#6f86d6');
  if(DL.choices){
    const ch=DL.choices;
    const w=170,h=ch.length*13+12,x=146,y=160-h-4;
    win(x,y,w,h);
    ch.forEach((c,i)=>{
      if(i===DL.choice)txt('>',x+6,y+8+i*13,'#9fe8ff');
      txt(c.t,x+16,y+8+i*13,i===DL.choice?'#fff':'#aab');
    });
  }
}
function wrapTxt(s,x,y,w,c,lh){
  const words=String(s||'').split(' ');let line='',ly=y;
  for(const wd of words){
    const test=line?line+' '+wd:wd;
    if(txtW(test)>w&&line){txt(line,x,ly,c);line=wd;ly+=(lh||10);}
    else line=test;
  }
  if(line)txt(line,x,ly,c);
}

function menuUpdate(){
  if(MN.sub<0){
    if(jp('b')||jp('m')){SFX.cancel();closeMenu();return;}
    if(jp('l')){MN.tab=(MN.tab+3)%4;MN.row=0;SFX.menu();}
    if(jp('r')){MN.tab=(MN.tab+1)%4;MN.row=0;SFX.menu();}
    if(MN.tab===1){ // items
      const L=invList();
      if(jp('u'))MN.row=(MN.row+L.length-1)%Math.max(1,L.length);
      if(jp('d'))MN.row=(MN.row+1)%Math.max(1,L.length);
      if(jp('a')&&L.length){const id=L[MN.row];
        if(ITEMS[id].key){toast(ITEMS[id].d);}
        else{MN.sub=1;MN.subRow=0;SFX.pick();}
      }
    }else if(MN.tab===2){ // equip: pick member
      if(jp('u'))MN.who=(MN.who+G.party.length-1)%G.party.length;
      if(jp('d'))MN.who=(MN.who+1)%G.party.length;
      if(jp('a')){MN.sub=2;MN.subRow=0;SFX.pick();}
    }else if(MN.tab===3){
      if(jp('a')){saveGame(false);}
    }
    return;
  }
  if(jp('b')){MN.sub=-1;SFX.cancel();return;}
  if(MN.sub===1){ // use item on member
    if(jp('u'))MN.subRow=(MN.subRow+G.party.length-1)%G.party.length;
    if(jp('d'))MN.subRow=(MN.subRow+1)%G.party.length;
    if(jp('a')){
      const id=invList()[MN.row],it=ITEMS[id],m=G.party[MN.subRow];
      if(!G.inv[id]){MN.sub=-1;return;}
      if(it.heal){if(m.hp<=0){toast(m.n+' is down.');return;}m.hp=Math.min(m.maxhp,m.hp+it.heal);removeItem(id);SFX.heal();}
      else if(it.tp){m.tp=Math.min(m.maxtp,m.tp+it.tp);removeItem(id);SFX.heal();}
      else if(it.revive){if(m.hp>0){toast(m.n+' is standing.');return;}m.hp=Math.floor(m.maxhp/2);removeItem(id);SFX.heal();}
      if(!G.inv[id])MN.sub=-1;
    }
  }else if(MN.sub===2){ // equip slots
    const m=G.party[MN.who];
    const opts=equipOptions(m);
    if(jp('u'))MN.subRow=(MN.subRow+opts.length-1)%Math.max(1,opts.length);
    if(jp('d'))MN.subRow=(MN.subRow+1)%Math.max(1,opts.length);
    if(jp('a')&&opts.length){
      const o=opts[MN.subRow];SFX.pick();
      if(o.k==='w'){G.stash.push(['w',m.weapon!=='rusted'?m.weapon:null]);m.weapon=o.id;}
      if(o.k==='a'){G.stash.push(['a',m.armor!=='cloth'?m.armor:null]);m.armor=o.id;}
      if(o.k==='c'){if(m.acc!=='none')G.accInv.push(m.acc);m.acc=o.id;}
      G.stash=G.stash.filter(e=>e[1]);
      // remove the equipped piece from stash/accInv
      if(o.k==='c'){const i=G.accInv.indexOf(o.id);if(i>=0)G.accInv.splice(i,1);}
      else{const i=G.stash.findIndex(e=>e[0]===o.k&&e[1]===o.id);if(i>=0)G.stash.splice(i,1);}
      MN.sub=-1;
    }
  }
}

function exploreDraw(t){
  const m=MAPS[G.map],rows=mapRows(G.map),pal=ZPAL[m.pal];
  const mw=rows[0].length*TS,mh=rows.length*TS;
  let camx=G.px*TS+(G.mx*TS)*G.moving+TS/2-W/2;
  let camy=G.py*TS+(G.my*TS)*G.moving+TS/2-H/2;
  camx=clamp(camx,0,Math.max(0,mw-W));camy=clamp(camy,0,Math.max(0,mh-H));
  camx=Math.round(camx);camy=Math.round(camy);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const x0=Math.floor(camx/TS),y0=Math.floor(camy/TS);
  for(let y=y0;y<=y0+Math.ceil(H/TS);y++)for(let x=x0;x<=x0+Math.ceil(W/TS);x++){
    if(y<0||y>=rows.length||x<0||x>=rows[0].length)continue;
    drawTile(rows[y][x],x*TS-camx,y*TS-camy,pal,x,y,t,rows);
  }
  (m.objects||[]).forEach(o=>{
    const sx=o.x*TS-camx,sy=o.y*TS-camy;
    if(sx<-TS||sx>W||sy<-TS||sy>H)return;
    if(o.type==='chest'&&!G.opened[o.id]){
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx+2,sy+13,12,2);
      ctx.fillStyle='#5a3617';ctx.fillRect(sx+2,sy+5,12,9);
      ctx.fillStyle='#8a5a2a';ctx.fillRect(sx+2,sy+5,12,4);
      ctx.fillStyle='#ffd44a';ctx.fillRect(sx+2,sy+8,12,2);ctx.fillRect(sx+7,sy+7,2,4);
      ctx.fillStyle='rgba(255,255,255,0.30)';ctx.fillRect(sx+3,sy+5,4,1);
      if(Math.floor(t*2)%3===0){ctx.fillStyle='#fff';ctx.fillRect(sx+12,sy+4,1,1);}
    }else if(o.type==='chest'){
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx+2,sy+13,12,2);
      ctx.fillStyle='#3a2410';ctx.fillRect(sx+2,sy+7,12,7);
      ctx.fillStyle='#241608';ctx.fillRect(sx+3,sy+8,10,3);
    }else if(o.type==='terminal'){
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx+3,sy+13,10,2);
      ctx.fillStyle='#1a1e2e';ctx.fillRect(sx+3,sy+2,10,12);
      ctx.fillStyle='#3a4258';ctx.fillRect(sx+3,sy+2,10,2);
      const on=Math.floor(t*2)%2;
      ctx.fillStyle=on?'#5ad4d4':'#1f6a6a';ctx.fillRect(sx+5,sy+5,6,5);
      ctx.fillStyle=on?'#bff':'#5ad4d4';ctx.fillRect(sx+5,sy+5+(Math.floor(t*4)%4),6,1);
    }else if(o.type==='boathouse'){
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(sx-1,sy+14,18,2);
      ctx.fillStyle='#3a2a1a';ctx.fillRect(sx,sy+4,16,12);
      ctx.fillStyle='#241a10';ctx.fillRect(sx+1,sy+10,3,1);ctx.fillRect(sx+11,sy+7,4,1);
      ctx.fillStyle='#5a4630';ctx.fillRect(sx-2,sy,20,5);
      ctx.fillStyle='#6f5a3e';ctx.fillRect(sx-2,sy,20,2);
      ctx.fillStyle='#0a0a10';ctx.fillRect(sx+6,sy+9,5,7);
      if(F('sense')&&!F('hidden_done')&&Math.floor(t*1.5)%4===0){
        ctx.fillStyle='rgba(159,232,255,0.6)';ctx.fillRect(sx+7,sy+11,3,1);}
    }
  });
  const bob=Math.floor(t*2)%2;
  (m.enemies||[]).forEach(e=>{
    if(D(e.id))return;
    const sx=e.x*TS-camx,sy=e.y*TS-camy-bob;
    if(sx<-TS||sx>W||sy<-TS||sy>H)return;
    const def=ENEMIES[e.e];
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(sx+3,sy+13+bob,10,2);
    ctx.fillStyle='#0a0a14';

const BT={on:false};
function ngMul(){return Math.pow(1.6,G.ngplus);}
function startBattle(groupIds,opts){
  opts=opts||{};
  BT.on=true;BT.after=opts.after||null;BT.mapEnemy=opts.mapEnemy||null;
  BT.guestId=null;
  if(opts.guest&&!G.party.some(m=>m.id===opts.guest)){
    BT.guestId=opts.guest;G.party.push(mkMember(opts.guest));
  }
  BT.grp=groupIds.map((id,i)=>{
    const d=ENEMIES[id];
    return {key:id,n:d.n,hp:Math.round(d.hp*ngMul()),maxhp:Math.round(d.hp*ngMul()),
      atk:Math.round(d.atk*ngMul()),df:Math.round(d.df*Math.sqrt(ngMul())),
      spd:d.spd,xp:Math.round(d.xp*Math.pow(1.3,G.ngplus)),gd:Math.round(d.gd*Math.pow(1.3,G.ngplus)),
      spr:d.spr,c:d.c,ai:d.ai||'basic',boss:d.boss,idx:i,
      defending:false,lastHitTech:false,healedOnce:false,wardenT:0,mirrorCmd:null};
  });
  BT.fleeable=!BT.grp.some(e=>e.boss);
  BT.phase='msg';BT.msgq=[(BT.grp.length>1?'Enemies appear!':BT.grp[0].n+' appears!')];
  BT.nextPhase='cmd';
  BT.who=0;BT.menu=0;BT.row=0;BT.tgt=0;BT.cmds=[];BT.msgT=0;BT.flash=0;BT.shake=0;BT.roundLastCmd=null;
  if(BT.mirrorRemarked===undefined)BT.mirrorRemarked=false;
  G.state='BATTLE';
  playTune(BT.grp[0].key==='mirroralys'?'finale':'battle');
  if(G.party.some(m=>m.acc==='archring'))BT.archring=true;else BT.archring=false;
}
function alive(list){return list.filter(e=>e.hp>0);}
function topCmd(){let t='Attack',n=-1;for(const k in G.cmdCounts)if(G.cmdCounts[k]>n){n=G.cmdCounts[k];t=k;}return t;}
function livingParty(){return G.party.filter(m=>m.hp>0);}
function nextCmdMember(){
  while(BT.who<G.party.length&&G.party[BT.who].hp<=0)BT.who++;
  if(BT.who>=G.party.length){execRound();return false;}
  BT.menu=0;BT.row=0;return true;
}
function battleUpdate(dt){
  if(BT.phase==='msg'){
    BT.msgT+=dt;
    if(jp('a')||BT.msgT>1.1){
      BT.msgT=0;BT.msgq.shift();
      if(!BT.msgq.length){
        if(BT.nextPhase==='cmd'){BT.phase='cmd';BT.who=0;nextCmdMember();}
        else if(BT.nextPhase==='exec')stepExec();
        else if(BT.nextPhase==='win')finishWin();
        else if(BT.nextPhase==='lose')gameOver();
        else if(BT.nextPhase==='fled'){endBattle(false);}
      }
    }
    return;
  }
  if(BT.phase!=='cmd')return;
  const m=G.party[BT.who];
  if(BT.menu===0){ // main command
    const opts=['Attack','Tech','Item','Defend'];if(BT.fleeable)opts.push('Flee');
    if(jp('u')){BT.row=(BT.row+opts.length-1)%opts.length;SFX.menu();}
    if(jp('d')){BT.row=(BT.row+1)%opts.length;SFX.menu();}
    if(jp('b')&&BT.who>0){BT.who--;while(BT.who>0&&G.party[BT.who].hp<=0)BT.who--;BT.cmds.pop();BT.menu=0;BT.row=0;SFX.cancel();return;}
    if(jp('a')){
      const c=opts[BT.row];SFX.pick();
      if(c==='Attack'){BT.menu=2;BT.tgt=0;BT.pend={cmd:'Attack'};}
      else if(c==='Tech'){if(!m.techs.length){toast('No techniques yet.');return;}BT.menu=1;BT.row2=0;}
      else if(c==='Item'){const L=invList().filter(i=>!ITEMS[i].key);if(!L.length){toast('Satchel is empty.');return;}BT.menu=3;BT.row2=0;}
      else if(c==='Defend'){G.cmdCounts.Defend++;BT.cmds.push({m,cmd:'Defend'});advCmd();}
      else if(c==='Flee'){BT.cmds.push({m,cmd:'Flee'});advCmd();}
    }
  }else if(BT.menu===1){ // tech list
    const ts=m.techs;
    if(jp('u')){BT.row2=(BT.row2+ts.length-1)%ts.length;SFX.menu();}
    if(jp('d')){BT.row2=(BT.row2+1)%ts.length;SFX.menu();}
    if(jp('b')){BT.menu=0;SFX.cancel();return;}
    if(jp('a')){
      const t=TECHS[ts[BT.row2]];
      const cost=(ts[BT.row2]==='sense'&&m.acc==='truthlens')?0:t.tp;
      if(m.tp<cost){toast('Not enough TP.');SFX.bump();return;}
      SFX.pick();BT.pend={cmd:'Tech',tech:ts[BT.row2]};
      if(t.tgt==='one'&&t.kind==='dmg'){BT.menu=2;BT.tgt=0;}
      else if(t.kind==='heal'||(t.kind==='sense')){BT.menu=4;BT.tgt=0;}
      else{commitCmd(m,BT.pend,null);}
    }
  }else if(BT.menu===2){ // enemy target
    const liv=alive(BT.grp);
    if(jp('l')||jp('u')){BT.tgt=(BT.tgt+liv.length-1)%liv.length;SFX.menu();}
    if(jp('r')||jp('d')){BT.tgt=(BT.tgt+1)%liv.length;SFX.menu();}
    if(jp('b')){BT.menu=BT.pend.cmd==='Tech'?1:0;SFX.cancel();return;}
    if(jp('a')){SFX.pick();commitCmd(m,BT.pend,liv[BT.tgt]);}
  }else if(BT.menu===3){ // item list
    const L=invList().filter(i=>!ITEMS[i].key);
    if(jp('u')){BT.row2=(BT.row2+L.length-1)%L.length;SFX.menu();}
    if(jp('d')){BT.row2=(BT.row2+1)%L.length;SFX.menu();}
    if(jp('b')){BT.menu=0;SFX.cancel();return;}
    if(jp('a')){SFX.pick();BT.pend={cmd:'Item',item:L[BT.row2]};BT.menu=4;BT.tgt=0;}
  }else if(BT.menu===4){ // ally target
    if(jp('u')){BT.tgt=(BT.tgt+G.party.length-1)%G.party.length;SFX.menu();}
    if(jp('d')){BT.tgt=(BT.tgt+1)%G.party.length;SFX.menu();}
    if(jp('b')){BT.menu=BT.pend.cmd==='Item'?3:1;SFX.cancel();return;}
    if(jp('a')){
      if(BT.pend.cmd==='Tech'&&TECHS[BT.pend.tech].kind==='sense'){SFX.pick();commitCmd(m,BT.pend,alive(BT.grp)[0]);return;}
      SFX.pick();commitCmd(m,BT.pend,G.party[BT.tgt]);
    }
  }
}
function commitCmd(m,pend,tgt){
  if(pend.cmd==='Attack')G.cmdCounts.Attack++;
  if(pend.cmd==='Tech'){G.cmdCounts.Tech++;G.lastTechName=TECHS[pend.tech].n;}
  if(pend.cmd==='Item')G.cmdCounts.Item++;
  BT.cmds.push({m,cmd:pend.cmd,tech:pend.tech,item:pend.item,tgt});
  advCmd();
}
function advCmd(){BT.who++;nextCmdMember();}
function execRound(){
  // build action order: party cmds + enemy intents, by speed
  const acts=[];
  BT.cmds.forEach(c=>acts.push({side:'p',spd:c.m.spd+(c.m.haste?3:0)+rnd(0,2),c}));
  alive(BT.grp).forEach(e=>acts.push({side:'e',spd:e.spd+rnd(0,2),e}));
  acts.sort((a,b)=>b.spd-a.spd);
  // flee jumps the queue
  const fi=acts.findIndex(a=>a.side==='p'&&a.c.cmd==='Flee');
  if(fi>=0){const f=acts.splice(fi,1)[0];acts.unshift(f);}
  BT.acts=acts;BT.ai=0;
  G.party.forEach(m=>m.defending=false);
  BT.grp.forEach(e=>e.defending=false);
  BT.roundLastCmd=BT.cmds.length?BT.cmds[BT.cmds.length-1].cmd:null;
  BT.lastPlayerCmd=BT.cmds.find(c=>c.m.id==='alys');
  BT.phase='msg';BT.msgq=[];BT.nextPhase='exec';BT.msgT=2;
}
function stepExec(){
  while(BT.ai<BT.acts.length){
    const a=BT.acts[BT.ai++];
    const msgs=[];
    if(a.side==='p'){
      const c=a.c,m=c.m;
      if(m.hp<=0)continue;
      if(c.cmd!=='Flee')BT.anim={side:'p',idx:G.party.indexOf(m),t:0.45,tot:0.45,kind:c.cmd};
      if(c.cmd==='Flee'){
        if(Math.random()<0.6){BT.msgq=['You slip away between reflections.'];BT.nextPhase='fled';BT.phase='msg';return;}
        msgs.push('No way out. The mirrors close ranks!');
      }else if(c.cmd==='Defend'){m.defending=true;msgs.push(m.n+' guards.');}
      else if(c.cmd==='Attack'){
        const t=c.tgt&&c.tgt.hp>0?c.tgt:alive(BT.grp)[0];
        if(!t){continue;}
        const dmg=Math.max(1,Math.round((mATK(m)*2-t.df-(t.defending?t.df:0))*rnd(0.85,1.15)));
        t.hp=Math.max(0,t.hp-dmg);t.lastHitTech=false;SFX.hit();BT.flash=0.15;
        t.flashT=0.22;fx('slash',epx(t),epy(t),'#fff');pop(epx(t),epy(t)-10,dmg,'#fff');
        msgs.push(m.n+' strikes '+t.n+' for '+dmg+'!');
        if(t.hp<=0){msgs.push(t.n+' shatters into light.');SFX.die();fx('shatter',epx(t),epy(t),t.c);}
        else if(t.ai==='mirroralys'&&topCmd()==='Attack'&&Math.random()<0.5){
          const cd=Math.max(1,Math.round(mATK(G.party[0])*0.5-mDEF(m)/2));
          m.hp=Math.max(0,m.hp-cd);pop(ppx(m),ppy(m)-4,cd,'#ff9a9a');BT.shake=0.2;
          msgs.push('She answers steel with steel! '+m.n+' takes '+cd+'.');
          if(m.hp<=0)msgs.push(m.n+' falls!');
        }
      }else if(c.cmd==='Tech'){
        const T=TECHS[c.tech];
        const cost=(c.tech==='sense'&&m.acc==='truthlens')?0:T.tp;
        if(m.tp<cost){msgs.push(m.n+' falters; not enough TP.');}
        else{
          m.tp-=cost;SFX.tech();BT.tflash={c:T.kind==='heal'?'#8fe8a0':'#9fe8ff',t:0.18};
          if(T.kind==='dmg'){
            const tgts=T.tgt==='all'?alive(BT.grp):[(c.tgt&&c.tgt.hp>0)?c.tgt:alive(BT.grp)[0]].filter(Boolean);
            msgs.push(m.n+': '+T.n+'! '+T.msg);
            tgts.forEach(t=>{
              FXS.push({k:'bolt',x1:W/2+14,y1:118,x2:epx(t),y2:epy(t)+10,t:0.35});
              // techniques grow with the caster and slip past most armor, so they stay worth casting late on
              let dmg=Math.max(1,Math.round((T.pow*1.5+m.lvl*3)*rnd(0.9,1.1)-t.df/4));
              if(t.ai==='mirroralys'&&topCmd()==='Tech'){dmg=Math.ceil(dmg/2);}
              t.hp=Math.max(0,t.hp-dmg);t.lastHitTech=true;BT.flash=0.15;
              t.flashT=0.22;fx('burst',epx(t),epy(t),'#9fe8ff');pop(epx(t),epy(t)-10,dmg,'#cfe0ff');
              msgs.push(t.n+' takes '+dmg+(t.ai==='mirroralys'&&topCmd()==='Tech'?' (she bends the technique aside)':'')+'.');
              if(t.hp<=0){msgs.push(t.n+' shatters into light.');SFX.die();fx('shatter',epx(t),epy(t),t.c);}
            });
          }else if(T.kind==='heal'&&(c.tgt||m).hp<=0){
            m.tp+=cost;msgs.push(m.n+': '+T.n+'... but '+(c.tgt||m).n+' is beyond its reach. (Moon Dew revives.)');
          }else if(T.kind==='heal'){
            const t=c.tgt||m;const h=Math.min(t.maxhp-t.hp,T.pow+m.lvl*3);
            t.hp+=h;SFX.heal();fx('heal',ppx(t),ppy(t));pop(ppx(t),ppy(t)-6,'+'+h,'#8fe8a0');
            msgs.push(m.n+': '+T.n+'. '+t.n+' recovers '+h+'.');
          }else if(T.kind==='debuff'){
            const t=(c.tgt&&c.tgt.hp>0)?c.tgt:alive(BT.grp)[0];
            if(t){t.df=Math.max(0,t.df-4);msgs.push(m.n+': '+T.n+'! '+t.n+'\'s guard turns brittle.');}
          }else if(T.kind==='buff'){
            G.party.forEach(p=>{if(p.hp>0)p.buff=1;});msgs.push(m.n+': '+T.n+'! '+T.msg);
          }else if(T.kind==='haste'){
            G.party.forEach(p=>{if(p.hp>0)p.haste=1;});msgs.push(m.n+': '+T.n+'! '+T.msg);
          }else if(T.kind==='sense'){
            const t=alive(BT.grp)[0];
            msgs.push('MIRROR SENSE: '+t.n+': HP '+t.hp+'/'+t.maxhp+'.');
            if(t.ai==='mirror')msgs.push('It moves when you move. It copies your last order.');
            if(t.ai==='colossus')msgs.push('It hurls back whatever hurt it last. Vary the blows.');
            if(t.ai==='mirroralys')msgs.push('She is countering your habit: '+topCmd()+'.');
          }
        }
      }else if(c.cmd==='Item'){
        const it=ITEMS[c.item];
        if(!G.inv[c.item]){msgs.push('The satchel is empty.');}
        else{
          const t=c.tgt||m;
          if(it.heal&&t.hp>0){removeItem(c.item);const h=Math.min(t.maxhp-t.hp,it.heal);t.hp+=h;SFX.heal();fx('heal',ppx(t),ppy(t));pop(ppx(t),ppy(t)-6,'+'+h,'#8fe8a0');msgs.push(t.n+' uses '+it.n+'.');}
          else if(it.tp){removeItem(c.item);t.tp=Math.min(t.maxtp,t.tp+it.tp);SFX.heal();pop(ppx(t),ppy(t)-6,'+TP','#8fc8ff');msgs.push(t.n+' recovers TP.');}
          else if(it.revive&&t.hp<=0){removeItem(c.item);t.hp=Math.floor(t.maxhp/2);SFX.heal();fx('heal',ppx(t),ppy(t));pop(ppx(t),ppy(t)-6,'UP!','#ffe070');msgs.push(t.n+' stands again!');}
          else msgs.push('Nothing happens.');
          const ma=alive(BT.grp).find(e=>e.ai==='mirroralys');
          if(ma&&topCmd()==='Item'){
            const v=livingParty()[0];
            if(v){const cd=Math.max(1,Math.round(mATK(G.party[0])*0.6-mDEF(v)/2-(v.defending?mDEF(v)/2:0)));
              v.hp=Math.max(0,v.hp-cd);pop(ppx(v),ppy(v)-4,cd,'#ff9a9a');BT.shake=0.2;
              msgs.push('She strikes while your hands are busy! '+v.n+' takes '+cd+'.');
              if(v.hp<=0)msgs.push(v.n+' falls!');}
          }
        }
      }
    }else{ // enemy action
      const e=a.e;if(e.hp<=0)continue;
      BT.anim={side:'e',e:e,t:0.45,tot:0.45};
      enemyAct(e,msgs);
    }
    if(!alive(BT.grp).length){BT.msgq=msgs;BT.nextPhase='win';BT.phase='msg';return;}
    if(!livingParty().length){BT.msgq=msgs;BT.nextPhase='lose';BT.phase='msg';return;}
    if(msgs.length){BT.msgq=msgs;BT.nextPhase='exec';BT.phase='msg';return;}
  }
  // round over: TP regen ring, reset
  G.party.forEach(m=>{if(m.hp>0&&m.acc==='archring')m.tp=Math.min(m.maxtp,m.tp+2);});
  BT.cmds=[];BT.phase='cmd';BT.who=0;nextCmdMember();
}
function eDamage(e,m,mult,pierce){
  const evade=m.acc==='refband'?0.12:0;
  if(Math.random()<evade)return -1;
  let def=mDEF(m)+(m.buff?3:0);
  if(m.defending)def*=2;
  if(pierce)def*=0.5;
  return Math.max(1,Math.round((e.atk*2*mult-def)*rnd(0.85,1.15)));
}
function hitParty(e,m,mult,msgs,pierce){
  const d=eDamage(e,m,mult,pierce);
  if(d<0){msgs.push(m.n+' blinks aside! (Reflect Band)');pop(ppx(m),ppy(m)-4,'MISS','#9fe8ff');return;}
  m.hp=Math.max(0,m.hp-d);SFX.hit();BT.shake=0.2;pop(ppx(m),ppy(m)-4,d,'#ff9a9a');
  msgs.push(e.n+' hits '+m.n+' for '+d+'.');
  if(m.hp<=0)msgs.push(m.n+' falls!');
}
function enemyAct(e,msgs){
  const liv=livingParty();if(!liv.length)return;
  const pick=()=>liv[ri(0,liv.length-1)];
  switch(e.ai){
    case 'mirror':{
      const lc=BT.roundLastCmd;
      if(lc==='Defend'){e.defending=true;msgs.push(e.n+' guards, the way you guarded.');}
      else if(lc==='Item'&&e.hp<e.maxhp){const h=Math.round(e.maxhp*0.15);e.hp=Math.min(e.maxhp,e.hp+h);pop(epx(e),epy(e)-10,'+'+h,'#8fe8a0');msgs.push(e.n+' mends itself, mimicking your caution. +'+h);}
      else if(lc==='Tech'){msgs.push(e.n+' echoes your technique!');liv.forEach(m=>hitParty(e,m,0.55,msgs));}
      else hitParty(e,pick(),1,msgs);
      break;}
    case 'warden':{
      e.wardenT++;
      if(e.wardenT%2===0){msgs.push(e.n+': VERIFICATION BEAM.');liv.forEach(m=>hitParty(e,m,0.6,msgs));}
      else hitParty(e,pick(),1,msgs);
      break;}
    case 'colossus':{
      if(e.lastHitTech){msgs.push(e.n+' replays your technique back, amplified!');liv.forEach(m=>hitParty(e,m,0.7,msgs));}
      else hitParty(e,pick(),1.15,msgs);
      break;}
    case 'guardian':{
      if(e.hp<e.maxhp*0.4&&!e.healedOnce){e.healedOnce=true;e.hp=Math.min(e.maxhp,e.hp+90);pop(epx(e),epy(e)-10,'+90','#8fe8a0');msgs.push(e.n+' draws on the archive. +90.');}
      else hitParty(e,pick(),1,msgs);
      break;}
    case 'mirroralys':{
      e.atk=Math.max(e.atk,Math.round(mATK(G.party[0])*0.66)); // she carries a mirrored copy of your weapon
      if(!BT.mirrorRemarked){BT.mirrorRemarked=true;}
      const pierce=topCmd()==='Defend';
      if(Math.random()<0.4){msgs.push('Mirror Alys: Refoi, your favorite shape of fire.');liv.forEach(m=>hitParty(e,m,0.6,msgs,pierce));}
      else hitParty(e,pick(),0.95,msgs,pierce);
      if(pierce&&!e.pnoted){e.pnoted=true;msgs.push('Your guard means nothing to someone who knows it from inside.');}
      break;}
    default:hitParty(e,pick(),1,msgs);
  }
}
function finishWin(){
  const xp=BT.grp.reduce((s,e)=>s+e.xp,0),gd=BT.grp.reduce((s,e)=>s+e.gd,0);
  addGold(gd);
  let ups=[];
  G.party.forEach(m=>{ups=ups.concat(gainXP(m,xp));});
  const msgs=xp>0?['Victory! '+xp+' xp, '+gd+' meseta.']:['The light between you goes quiet.'];
  ups.forEach(u=>{msgs.push(u.n+' reached level '+u.lvl+'!');u.learned.forEach(t=>msgs.push(u.n+' learned '+TECHS[t].n+'!'));});
  SFX.victory();
  BT.msgq=msgs;BT.phase='msg';BT.nextPhase='fled';BT.winFlag=true;
}
function endBattle(){
  const won=BT.winFlag;
  if(won&&BT.mapEnemy)G.defeated[BT.mapEnemy.id]=1;
  const afterDlg=won?(BT.after||(BT.mapEnemy&&BT.mapEnemy.after)||null):null;
  const wasBoss=won&&BT.mapEnemy&&BT.mapEnemy.boss;
  if(BT.guestId)G.party=G.party.filter(m=>m.id!==BT.guestId);
  BT.on=false;BT.winFlag=false;
  G.state='EXPLORE';
  playTune(MAPS[G.map].music);
  G.party.forEach(m=>{m.buff=0;m.haste=0;m.defending=false;});
  if(afterDlg)runDlg(afterDlg);
  else if(wasBoss)autosave();
  clearJP();
}
function gameOver(){
  BT.on=false;G.state='GAMEOVER';stopTune();

// ---- scenic battle backdrops, PSIV/PSII style, per zone
function mountainBand(y,h,amp,base,top,seed){
  for(let x=0;x<W;x++){
    const hgt=Math.floor((Math.sin(x*0.018+seed)*0.5+0.5)*amp
              +(Math.sin(x*0.05+seed*2)*0.5+0.5)*amp*0.4);
    ctx.fillStyle=base;ctx.fillRect(x,y+h-hgt,1,hgt+ (H-y));
    ctx.fillStyle=top;ctx.fillRect(x,y+h-hgt,1,2);
    if(hash(x,seed|0)>0.85){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x,y+h-hgt+2,1,2);}
  }
}
function ditherBand(y,h,c1,c2){
  ctx.fillStyle=c1;ctx.fillRect(0,y,W,h);
  ctx.fillStyle=c2;
  for(let yy=y;yy<y+h;yy++)for(let xx=(yy%2)*2;xx<W;xx+=4)ctx.fillRect(xx,yy,2,1);
}
function drawBattleScene(pz,HOR,t){
  if(pz==='camineet'||pz==='lake'){
    // bright sky, distant green hills, grassy field
    for(let y=0;y<HOR;y++){ctx.fillStyle=lerpC('#7fb4ee','#cfe6fa',y/HOR);ctx.fillRect(0,y,W,1);}
    // clouds
    for(let k=0;k<5;k++){
      const cx=((k*73+t*6)%(W+60))-30,cy=10+((k*13)%26),cw=26+((k*7)%18);
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillRect(cx,cy,cw,4);ctx.fillRect(cx+5,cy-3,cw-12,4);ctx.fillRect(cx+3,cy+4,cw-6,2);
    }
    mountainBand(HOR-26,22,16,'#3f7a52','#5fa06e',1.2);
    mountainBand(HOR-14,14,10,'#2f6442','#4a8458',3.7);
    ditherBand(HOR,H-HOR,'#379a44','#2c8038');
    ctx.fillStyle='#1f6a2e';for(let k=0;k<40;k++){const x=(hash(k,5)*W)|0,y=HOR+6+((hash(k,9)*(H-HOR-8))|0);ctx.fillRect(x,y,2,1);}
  }else if(pz==='sands'){
    // PSIV Motavia desert: tan sky, red-brown mesas, sandy floor
    for(let y=0;y<HOR;y++){ctx.fillStyle=lerpC('#d8b06a','#f0e0b0',y/HOR);ctx.fillRect(0,y,W,1);}
    mountainBand(HOR-30,26,20,'#9a5a38','#bd7a4e',0.6);
    mountainBand(HOR-16,16,12,'#7a4228','#9a5a38',2.9);
    ditherBand(HOR,H-HOR,'#cda058','#b88a44');
    ctx.fillStyle='#9a7038';for(let k=0;k<26;k++){const x=(hash(k,5)*W)|0,y=HOR+8+((hash(k,9)*(H-HOR-10))|0);ctx.fillRect(x,y,3,2);}
  }else if(pz==='wastes'){
    // dead violet waste under a bruised sky
    for(let y=0;y<HOR;y++){ctx.fillStyle=lerpC('#2a0a3e','#6a2068',y/HOR);ctx.fillRect(0,y,W,1);}
    for(let k=0;k<30;k++){const x=(hash(k,3)*W)|0,y=(hash(k,11)*HOR)|0;if(Math.floor(t*2+k)%7)ctx.fillStyle=hash(k,7)>0.5?'#e88ad8':'#a050a0',ctx.fillRect(x,y,1,1);}
    mountainBand(HOR-22,18,14,'#3a1a44','#5a2a64',1.9);
    ditherBand(HOR,H-HOR,'#3f2849','#341e3c');
    ctx.fillStyle='#e84ac0';for(let k=0;k<18;k++){const x=(hash(k,5)*W)|0,y=HOR+10+((hash(k,9)*(H-HOR-12))|0);if(Math.floor(t*3+k)%4)ctx.fillRect(x,y,1,1);}
  }else if(pz==='vault'||pz==='spire'){
    // starfield void with the blue grid: keep the cyber look for interiors
    ctx.fillStyle='#070818';ctx.fillRect(0,0,W,HOR);
    for(let k=0;k<34;k++){const x=(hash(k,3)*W)|0,y=(hash(k,11)*HOR)|0;
      if(Math.floor(t*2+k)%9!==0){ctx.fillStyle=hash(k,7)>0.6?'#cfe0ff':'#5a6aa0';ctx.fillRect(x,y,1,1);}}
    if(pz==='spire'){
      ctx.fillStyle='#16306a';ctx.beginPath();ctx.arc(286,30,12,0,7);ctx.fill();
      ctx.fillStyle='#2a4f9e';ctx.beginPath();ctx.arc(283,27,8,0,7);ctx.fill();
      ctx.fillStyle='rgba(159,200,255,0.45)';ctx.fillRect(266,32,40,1);
    }
    const gridC=lerpC('#3038c8','#7fa0e0',0.22);
    ctx.fillStyle='#060614';ctx.fillRect(0,HOR,W,H-HOR);
    let gy=HOR+2,stepy=2.4;
    while(gy<H){ctx.fillStyle=gridC;ctx.globalAlpha=0.7;ctx.fillRect(0,gy|0,W,1);ctx.globalAlpha=1;gy+=stepy;stepy*=1.42;}
    for(let k=-8;k<=8;k++){ctx.strokeStyle=gridC;ctx.globalAlpha=0.5;
      ctx.beginPath();ctx.moveTo(W/2+k*11,HOR);ctx.lineTo(W/2+k*64,H+30);ctx.stroke();ctx.globalAlpha=1;}
    ctx.fillStyle='rgba(170,190,255,0.5)';ctx.fillRect(0,HOR,W,1);
    return;
  }
  // shared ground shadow line
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,HOR,W,2);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,HOR,W,1);
}

let TITLE={row:0,hasSave:false,checked:false};
async function titleRefresh(){
  const d=await loadSaveData();
  TITLE.hasSave=!!d;TITLE.data=d;TITLE.checked=true;
}
function titleOpts(){
  const o=['New Game'];
  if(TITLE.hasSave){o.push('Continue');o.push('Delete Save');}
  return o;
}
function titleUpdate(){
  if(!TITLE.checked)return;
  const o=titleOpts();
  if(jp('u')){TITLE.row=(TITLE.row+o.length-1)%o.length;TITLE.sure=false;SFX.menu();}
  if(jp('d')){TITLE.row=(TITLE.row+1)%o.length;TITLE.sure=false;SFX.menu();}
  if(jp('a')){
    const c=o[TITLE.row];SFX.pick();
    if(c==='New Game')newGame(false);
    else if(c==='Continue'&&TITLE.data){unpackSave(TITLE.data);toast('Welcome back.');}
    else if(c==='Delete Save'&&!TITLE.sure){TITLE.sure=true;SFX.bump();toast('Really delete your save? Press again to delete.');}
    else if(c==='Delete Save'){deleteSave();TITLE.hasSave=false;TITLE.data=null;TITLE.row=0;TITLE.sure=false;toast('Save deleted.');}
  }
}

    for(let y=0;y<H;y++){ctx.fillStyle=lerpC('#08081e','#1a1240',y/H);ctx.fillRect(0,y,W,1);}
    for(let i=0;i<90;i++){const x=(hash(i,7)*W)|0,y=(hash(i,13)*H)|0;
      if(Math.floor(t*1.5+i)%8!==0){ctx.fillStyle=hash(i,3)>0.7?'#fff':'#9ab0e0';ctx.fillRect(x,y,1,1);}}
    // large real moon
    for(let r=34;r>22;r-=2){ctx.fillStyle='rgba(200,220,255,'+(0.04*(34-r))+')';ctx.beginPath();ctx.arc(108,96,r,0,7);ctx.fill();}
    ctx.fillStyle='#eef0fa';ctx.beginPath();ctx.arc(108,96,24,0,7);ctx.fill();
    ctx.fillStyle='#d2d8ee';ctx.beginPath();ctx.arc(100,88,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(116,104,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(114,86,3,0,7);ctx.fill();

    for(let r=26;r>16;r-=2){ctx.fillStyle='rgba(150,180,255,'+(0.03*(26-r))+')';ctx.beginPath();ctx.arc(218,118,r,0,7);ctx.fill();}
    ctx.fillStyle='rgba(190,210,255,0.6)';ctx.beginPath();ctx.arc(218,118,17,0,7);ctx.fill();
    ctx.fillStyle='rgba(150,180,255,0.3)';ctx.fillRect(214,96,8,52);
    // shimmer line between them
    for(let k=0;k<14;k++){const f=k/14;ctx.fillStyle='rgba(150,180,255,'+(0.2*(1-f))+')';
      ctx.fillRect(108+(218-108)*f, 96+(118-96)*f+Math.sin(t*3+k)*2, 2,1);}
  },
  town(t){
    // dawn over Glass Camineet
    for(let y=0;y<H;y++){let c;const f=y/H;if(f<0.45)c=lerpC('#1a2a6a','#3a5a9a',f/0.45);else c=lerpC('#3a5a9a','#5a8ab8',(f-0.45)/0.55);ctx.fillStyle=c;ctx.fillRect(0,y,W,1);}
    // low sun glow
    ctx.fillStyle='rgba(255,220,150,0.15)';for(let r=40;r>0;r-=4){ctx.beginPath();ctx.arc(160,150,r*2,0,7);ctx.fill();}
    // glass towers silhouetted
    const tw=[20,52,86,210,248,284];
    tw.forEach((x,i)=>{const h2=50+(hash(i,9)*60|0);ctx.fillStyle='#1a2c52';ctx.fillRect(x,150-h2,26,h2);
      ctx.fillStyle='rgba(120,180,240,0.3)';ctx.fillRect(x+2,150-h2,3,h2);
      ctx.fillStyle='#9fe0ff';for(let wy=150-h2+6;wy<148;wy+=9)if(hash(x,wy)>0.5)ctx.fillRect(x+8,wy,3,3);});
    // central crystal
    ctx.fillStyle='#5fd8ff';ctx.globalAlpha=0.4;ctx.beginPath();ctx.moveTo(160,70);ctx.lineTo(172,110);ctx.lineTo(160,150);ctx.lineTo(148,110);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#bff4ff';ctx.beginPath();ctx.moveTo(160,78);ctx.lineTo(166,110);ctx.lineTo(160,142);ctx.lineTo(154,110);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(159,100+(Math.floor(t*2)%3),2,8);
    // ground
    ctx.fillStyle='#2a8628';ctx.fillRect(0,150,W,H-150);
    ctx.fillStyle='#349a31';for(let i=0;i<60;i++){const x=(hash(i,4)*W)|0,y=152+((hash(i,8)*60)|0);ctx.fillRect(x,y,2,1);}
  },
  veil(t){
    // abstract: the mirror-world reveal, cracked glass over a face
    for(let y=0;y<H;y++){ctx.fillStyle=lerpC('#10081e','#241040',y/H);ctx.fillRect(0,y,W,1);}
    for(let i=0;i<60;i++){const x=(hash(i,7)*W)|0,y=(hash(i,13)*H)|0;ctx.fillStyle=hash(i,3)>0.5?'#e88ad8':'#7050b0';if(Math.floor(t*2+i)%6)ctx.fillRect(x,y,1,1);}
    // cracked mirror lines radiating
    ctx.strokeStyle='rgba(190,210,255,0.5)';
    for(let k=0;k<9;k++){const a=k/9*6.28;ctx.beginPath();ctx.moveTo(160,112);
      let px=160,py=112;for(let j=0;j<4;j++){px+=Math.cos(a)*22+hash(k,j)*10-5;py+=Math.sin(a)*22+hash(k,j+9)*10-5;ctx.lineTo(px,py);}ctx.stroke();}
    ctx.fillStyle='rgba(95,216,255,0.15)';for(let r=10;r>0;r-=2){ctx.beginPath();ctx.arc(160,112,r*6,0,7);ctx.fill();}
    ctx.fillStyle='#9fe8ff';ctx.beginPath();ctx.arc(160,112,5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(158,110,4,4);
  }
};

function cineDraw(t){
  const p=CINE.seq[CINE.idx];if(!p){return;}
  const pim=p.img&&CINE_IMGS[p.img];
  if(pim&&pim._ready){ctx.drawImage(pim,0,0,W,H);}
  else{(cineScenes[p.bg]||cineScenes.moons)(t);}
  // letterbox bars for cinematic feel
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,14);ctx.fillRect(0,H-46,W,46);
  // optional portrait card, slides in
  if(p.port){
    const px=p.portSide==='r'?W-66:10;
    win(px-2,H-46-58,56,56);
    drawPortrait(px,H-46-56,p.port);
  }
  // narration box
  ctx.fillStyle='rgba(8,10,30,0.9)';ctx.fillRect(0,H-32,W,32);
  ctx.fillStyle='#5fd8ff';ctx.fillRect(0,H-32,W,1);
  if(p.s){txt(p.s,10,H-28,'#9fe8ff');}
  const lines=p.t;const shown=Math.floor(CINE.reveal);
  let cc=0;
  for(let li=0;li<lines.length;li++){
    let line='';
    for(let ci=0;ci<lines[li].length;ci++){if(cc<shown)line+=lines[li][ci];cc++;}
    txt(line,10,H-18+li*10,'#dfe6ff');
  }
  // prompt
  if(shown>=cineTotal(p)&&Math.floor(t*2)%2)txt('>',W-12,H-12,'#9fb4e8');
}
function cineTotal(p){return p.t.reduce((a,l)=>a+l.length,0);}
function cineUpdate(){
  const p=CINE.seq[CINE.idx];if(!p){endCine();return;}
  CINE.reveal+=2.2;
  if(jp('a')||jp('b')){
    if(CINE.reveal<cineTotal(p)){CINE.reveal=cineTotal(p);}
    else{CINE.idx++;CINE.reveal=0;if(CINE.idx>=CINE.seq.length){endCine();}}
  }
}
function endCine(){CINE.on=false;const cb=CINE.after;G.state='EXPLORE';if(cb)cb();}

function titleDraw(t){
  // ---- cover art
  if(COVER_READY){
    ctx.drawImage(COVER_IMG,0,0,W,H);
  }else{
    for(let y=0;y<H;y++){ctx.fillStyle=lerpC('#0a0620','#0e1838',y/H);ctx.fillRect(0,y,W,1);}
    txtC('...',W/2,H/2,'#445',1);
  }
  // ---- title text, top, gold with soft shadow over a subtle darkener
  ctx.fillStyle='rgba(6,8,26,0.40)';ctx.fillRect(0,4,W,26);
  const pulse=0.75+Math.sin(t*1.6)*0.25;
  // larger title: scale-4 glyphs with tight kerning so it fits 320px
  const TT='MIRROR OF ALGOL', TSC=2, ADV=6*TSC, tw=TT.length*ADV-TSC;
  const drawBig=(ox,oy,col)=>{let cx0=ox;
    for(let i2=0;i2<TT.length;i2++){const g=glyph(TT[i2]);ctx.fillStyle=col;
      for(let cx=0;cx<5;cx++){const bits=g[cx];for(let ry=0;ry<7;ry++)if(bits&(1<<ry))ctx.fillRect(cx0+cx*TSC,oy+ry*TSC,TSC,TSC);}
      cx0+=ADV;}};
  drawBig(Math.round(W/2-tw/2)+2,9,'rgba(8,6,2,0.9)');
  drawBig(Math.round(W/2-tw/2),7,'#ffe9a8');
  ctx.fillStyle='rgba(95,216,255,'+pulse+')';
  ctx.fillRect(W/2-tw/2-22,18,18,2);ctx.fillRect(W/2+tw/2+4,18,18,2);
  // ---- menu, lower-left with a readability scrim
  if(!TITLE.checked){
    ctx.fillStyle='rgba(6,8,22,0.55)';ctx.fillRect(8,170,150,40);
    txt('...',16,186,'#bcc');return;
  }
  const opts=titleOpts();
  ctx.fillStyle='rgba(6,8,22,0.5)';ctx.fillRect(8,168,140,opts.length*13+10);
  ctx.fillStyle='rgba(95,216,255,0.5)';ctx.fillRect(8,168,140,1);
  opts.forEach((o,i2)=>{
    const y=174+i2*13, x=24;
    if(i2===TITLE.row){
      const dx=Math.round(Math.sin(t*5)*2);
      ctx.fillStyle='#ffe070';ctx.fillRect(x-12+dx,y+1,4,4);
      txt(o,x,y,'#fff');
    }else txt(o,x,y,'#9aa6d0');
  });
  ctx.fillStyle='rgba(6,8,22,0.5)';ctx.fillRect(188,204,128,14);
  txt(touchShown?'A confirm':'Z confirm   M mute',touchShown?248:194,207,'#aab6e0');
}

}

}
// ---- endings
const END={lines:[],idx:0,kind:''};
function startEnding(kind){
  END.kind=kind;END.idx=0;
  G.state='ENDING';DL.script=null;playTune('ending');
  const L=[];
  if(kind==='merge'){
    L.push('You take her hand. It is exactly the temperature of your own.');
    L.push('The seam does not tear. It settles, the way a scar settles: part of the skin at last.');
    L.push('Alis, who saved a living world. Alys, who died for one. One guardian now, with two memories of home.');
    L.push('The Mirror steadies. Integrity climbs, point by patient point.');
    L.push('In Glass Camineet the bells ring on time. Doran waves from the water line, and means it.');
    L.push('Joren and Mina grow old together twice over, neither counting which of them is the echo.');
    L.push('Lia\'s music box plays forward now. Nobody remembers deciding that.');
    L.push('Some nights you stand at the apex and watch five small lands breathe.');
    L.push('Home was never a place you could walk back to. It was a thing you could choose to keep.');
    L.push('So you keep it.');
  }else{
    L.push('You let go of her hand, and of your own.');
    L.push('The Mirror opens like a window left unlatched. There is no shattering. Only release.');
    L.push('The archived minds rise the way heat rises off summer stone: unhurried, certain, free.');
    L.push('Tein goes laughing at something he never got to finish saying.');
    L.push('Mara goes side by side with a woman who has her stride, her squint, her name.');
    L.push('Orin, snug in deep storage, elects to stay. Somebody should mind the empty house, he says.');
    L.push('Last of all, the two of you. Alis toward her thousand-year morning. Alys toward her unfinished evening.');
    L.push('For one breath you are neither, and both, and unafraid.');
    L.push('The pale moon sets. Its reflection, for the first time, does not follow.');
    L.push('Wherever freed minds go, they go home.');
  }
  if(G.clarity>=4){
    L.push('');
    L.push('And because you looked closely, all the way here, you understood one thing more:');
    L.push('the Mirror was never a prison or a lie. It was a love letter, written by a dying machine,');
    L.push('addressed to everyone it could not bear to lose. You read it to the end. That mattered.');
  }
  L.push('');
  L.push('M I R R O R   O F   A L G O L');
  L.push(kind==='merge'?'ENDING: THE GUARDIAN':'ENDING: THE OPEN HAND');
  L.push('');
  L.push('Z: begin again (New Game+)   X: title');
  // word-wrap every line to the screen (50 chars at 6px/char inside a 320px frame)
  const wrapEnd=(line)=>{
    if(line.length<=50)return [line];
    const words=line.split(' ');const out=[];let cur='';
    words.forEach(w2=>{
      if((cur+' '+w2).trim().length>50){if(cur)out.push(cur);cur=w2;}
      else cur=(cur?cur+' ':'')+w2;
    });
    if(cur)out.push(cur);
    return out;
  };
  END.lines=L.flatMap(wrapEnd);
}
function endingUpdate(){
  if(END.view===undefined){END.view=-1;} // -1 = follow the newest row
  if(jp('u')){
    const cur=END.view<0?END.idx:END.view;
    END.view=Math.max(6,cur-1);SFX.menu();
  }
  if(jp('d')){
    if(END.view>=0){
      END.view++;
      if(END.view>=END.idx)END.view=-1; // caught up: resume following
      SFX.menu();
    }
  }
  if(END.idx<END.lines.length-1){
    if(jp('a')){END.idx=Math.min(END.lines.length-1,END.idx+3);END.view=-1;SFX.menu();}
  }else{
    const az=jp('a');
    if(az&&END.view<0){SFX.pick();newGame(true);toast('New Game+. The Mirror remembers your strength.');}
    else if(az){END.view=-1;SFX.menu();}
    if(jp('b')){G.state='TITLE';titleRefresh();playTune('title');}
  }
}
let endScroll=0;
function endingDraw(t,dt){
  const card=CINE_IMGS[END.kind==='merge'?'end_merge':'end_wake'];
  if(card&&card._ready){
    ctx.drawImage(card,0,0,W,H);
    // legibility scrim over the lower half, deepening toward the bottom
    for(let y=104;y<H;y++){
      const f=(y-104)/(H-104);
      ctx.fillStyle='rgba(4,6,22,'+(0.25+f*0.62).toFixed(3)+')';
      ctx.fillRect(0,y,W,1);
    }
  }else{
    for(let y=0;y<H;y+=4){
      ctx.fillStyle=lerpC('#04061a','#0c1030',y/H);
      ctx.fillRect(0,y,W,4);
    }
    for(let k=0;k<60;k++){
      const sp=0.5+hash(k,3)*1.5;
      const x=((hash(k,7)*W)+t*2*sp)%W;
      const y=((hash(k,11)*H)+t*4*sp)%H;
      ctx.fillStyle=hash(k,5)>0.7?'rgba(255,255,255,0.8)':'rgba(150,170,230,0.5)';
      ctx.fillRect(x|0,y|0,1,1);
    }
  }
  const browsing=END.view!==undefined&&END.view>=0;
  endScroll+=dt*8;
  if(!browsing&&END.idx<END.lines.length-1&&endScroll>14){endScroll=0;END.idx++;}
  const endRow=browsing?Math.min(END.view,END.idx):END.idx;
  const startRow=Math.max(0,endRow-6);
  let y=Math.max(118,H-16-(endRow-startRow+1)*13);
  for(let i2=startRow;i2<=endRow;i2++){
    const live=!browsing&&i2===END.idx;
    txtC(END.lines[i2],W/2,y,live?'#fff':'#9aaad0',8);
    y+=13;
  }
  // scroll indicators
  if(startRow>0&&Math.floor(t*2)%2){txtC('^ more',W/2,108,'#6f86d6');}
  if(browsing&&endRow<END.idx){txtC('v',W/2,214,'#6f86d6');}
  if(!browsing&&END.idx>=END.lines.length-1){txtC('Up: re-read',272,108,'#5a668e');}
}

function devParty(lvl,wpn,arm,extras,then){

  extras.forEach(id=>G.party.push(mkMember(id)));
  G.party.forEach(m=>{while(m.lvl<lvl)gainXP(m,xpNext(m.lvl));
    m.weapon=wpn;m.armor=arm;m.hp=m.maxhp;m.tp=m.maxtp;});
  DL.script=null;CINE.on=false;
  then();
  if(G.state!=='ENDING')G.state='EXPLORE';
  toast('dev: '+DEVPTS[DEV.row].n);
}
function openDev(){
  if(!G||!G.party){newGame(false);CINE.on=false;DL.script=null;G.state='EXPLORE';}
  DEV.row=0;G.state='DEV';
}
function devUpdate(){
  if(jp('u')){DEV.row=(DEV.row+DEVPTS.length-1)%DEVPTS.length;SFX.menu();}
  if(jp('d')){DEV.row=(DEV.row+1)%DEVPTS.length;SFX.menu();}
  if(jp('a')){DEVPTS[DEV.row].go();}
  else if(jp('b')){G.state='EXPLORE';}
}
function devDraw(){
  win(30,20,260,184);
  txt('DEV SPAWN',40,28,'#9fe8ff');
  ctx.fillStyle='rgba(159,232,255,0.45)';ctx.fillRect(40,37,54,1);
  DEVPTS.forEach((p,i)=>{
    const y=46+i*15;
    if(i===DEV.row){ctx.fillStyle='rgba(159,232,255,0.12)';ctx.fillRect(36,y-2,248,13);txt('>',38,y,'#9fe8ff');}
    txt(p.n,48,y,i===DEV.row?'#fff':'#9aa6d0');
  });
  txt('Z spawn   X close',40,192,'#5a668e');
}
window.__openDev=openDev;
// dev tools only when the page is opened with ?dev
const DEVMODE=/[?&]dev\b/.test(location.search);
if(DEVMODE){document.getElementById('devlink').style.display='block';
  document.getElementById('devlink').addEventListener('click',()=>openDev());
  addEventListener('keydown',e=>{if(e.key==='`')openDev();});}

//==================================================================
// 14. MAIN LOOP / BOOT
//==================================================================
let perfNow=0,lastT=0,acc=0,gameT=0;
function frame(ts){
  requestAnimationFrame(frame);
  perfNow=ts;
  if(!lastT)lastT=ts;
  let dt=(ts-lastT)/1000;lastT=ts;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  const step=1/60;
  while(acc>=step){update(step);acc-=step;}
  frameStamp++;
  draw(gameT,dt);
  audioUpdate();
}
function update(dt){
  gameT+=dt;
  if(jp('m')){AU.on=!AU.on;toast(AU.on?'Sound on.':'Sound off.');}
  if(BT.flash>0)BT.flash-=dt;
  if(BT.shake>0)BT.shake-=dt;
  fxUpdate(dt);
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}
  if(zoneBanner){zoneBanner.t-=dt;if(zoneBanner.t<=0)zoneBanner=null;}
  if(!G||G.state==='TITLE'){titleUpdate();return;}
  switch(G.state){
    case 'EXPLORE':exploreUpdate(dt);break;
    case 'DIALOGUE':dlgUpdate();break;
    case 'BATTLE':battleUpdate(dt);break;
    case 'MENU':menuUpdate();break;
    case 'SHOP':shopUpdate();break;
    case 'GAMEOVER':gameOverUpdate();break;
    case 'ENDING':endingUpdate();break;
    case 'CINE':cineUpdate();break;
    case 'DEV':devUpdate();break;
  }
}
function draw(t,dt){
  if(!G||G.state==='TITLE'){titleDraw(t);drawToasts();return;}
  switch(G.state){
    case 'EXPLORE':exploreDraw(t);break;
    case 'DIALOGUE':exploreDraw(t);dlgDraw();break;
    case 'CINE':cineDraw(t);break;
    case 'DEV':exploreDraw(t);devDraw();break;
    case 'BATTLE':battleDraw(t);break;
    case 'MENU':exploreDraw(t);menuDraw();break;
    case 'SHOP':exploreDraw(t);shopDraw();break;
    case 'GAMEOVER':gameOverDraw();break;
    case 'ENDING':endingDraw(t,dt);break;
  }
  drawToasts();
}
// boot
G=null;
(async()=>{await titleRefresh();})();
playTune('title');
requestAnimationFrame(frame);
</script>
