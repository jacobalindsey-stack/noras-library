<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nora's Library</title>
<meta name="description" content="Games made by Nora: witches, cats, moonlit cities, sea voyages and a bakery at dusk.">
<meta name="theme-color" content="#2a0712">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%235a1229'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23e0b86a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --velvet-deep: #2a0712;
    --velvet: #6e1730;
    --gold: #e0b86a;
    --gold-deep: #b9852f;
    --paper: #fffaf3;
    --paper-rule: #ecdcbf;
    --ink: #3b0f1f;
    --kind: #8e4a5a;
    --cream: #f6e2cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--velvet-deep);
    color: var(--ink);
    font-family: "DM Serif Display", Georgia, serif;
    overflow-x: hidden;
  }

  /* ---------- the curtain ---------- */
  header {
    position: relative;
    padding: 0 16px clamp(76px, 9vh, 124px);
    background:
      radial-gradient(ellipse 60% 70% at 50% 42%, rgba(255,206,140,.30), rgba(255,206,140,0) 70%),
      repeating-linear-gradient(90deg, #4a0c20 0px, #6e1730 26px, #8a2240 34px, #6e1730 44px, #4a0c20 72px);
  }
  .valance, .sparkles, .fringe { position: absolute; left: 0; pointer-events: none; }
  .valance { top: 0; width: 100%; height: 96px; }
  .sparkles { inset: 0; width: 100%; height: 100%; }
  .fringe { bottom: 0; width: 100%; height: 34px; }
  .marquee { position: relative; max-width: 1000px; margin: 0 auto; padding-top: clamp(64px, 9vh, 130px); text-align: center; }
  h1 {
    margin: 0;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(38px, min(8.5vw, 11vh), 120px);
    line-height: .95;
    background: linear-gradient(180deg, #fff6df 0%, #f2d08a 48%, #c48a35 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(255,200,120,.35)) drop-shadow(0 3px 0 rgba(58,8,24,.6));
  }
  .flourish { display: block; margin: 12px auto 0; width: 280px; max-width: 70%; height: auto; }

  /* ---------- the programme card ---------- */
  main { position: relative; margin-top: -72px; padding: 0 12px 72px; }
  .card {
    position: relative;
    max-width: 1180px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 40px 90px rgba(10,0,4,.6), 0 0 0 1px #e6cfae;
    padding: clamp(22px, 3.2vh, 44px) clamp(12px, 3vw, 44px);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid #d9b877;
    outline: 1px solid var(--paper-rule);
    outline-offset: -6px;
    border-radius: 2px;
    pointer-events: none;
  }
  /* the acts: a wrapping grid of tiles, every row centred.
     ~4 across on a wide desktop, 3 on a laptop, 2 on a phone. */
  .programme {
    position: relative;
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 1.6vh, 22px) clamp(8px, 1.6vw, 22px);
    --tile: clamp(124px, 18vw, 230px);
  }
  .programme li { width: var(--tile); }

  .act {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.1vh, 12px);
    padding: clamp(8px, 1.4vh, 16px) 6px clamp(10px, 1.6vh, 18px);
    text-align: center;
    color: inherit;
    text-decoration: none;
    border-radius: 12px;
    transition: background-color .25s ease;
  }
  .numeral { font-size: clamp(22px, min(2.2vw, 3.4vh), 30px); line-height: 1; color: var(--gold-deep); }
  .cameo {
    /* sized by screen height as well as width, so two rows fit a laptop screen */
    width: clamp(84px, min(9vw, 10.5vh), 120px);
    aspect-ratio: 156 / 200;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.10), rgba(255,255,255,0) 60%), var(--ground);
    box-shadow:
      inset 0 0 0 6px var(--ground),
      inset 0 0 0 7px color-mix(in srgb, var(--foil) 60%, transparent),
      0 0 0 4px var(--paper),
      0 0 0 5px #d9b877,
      0 18px 30px -12px rgba(42,7,18,.55),
      0 0 44px -6px color-mix(in srgb, var(--foil) 55%, transparent);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .cameo svg {
    width: 52%;
    height: auto;
    color: var(--foil);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--foil) 40%, transparent));
  }
  .title { font-size: clamp(17px, 1.9vw, 27px); line-height: 1.1; color: var(--ink); }
  .kind {
    margin-top: 6px;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(10px, .85vw, 12px);
    line-height: 1.4;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--kind);
  }
  .platforms {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px 10px;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(11px, .9vw, 12.5px);
    line-height: 1;
    color: #9a7a46;
  }
  .platforms span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .platforms svg { width: 13px; height: 13px; flex: none; }
  .platforms .best { color: var(--gold-deep); }
  a.act:hover, a.act:focus-visible { background-color: rgba(201,150,63,.09); }
  a.act:hover .cameo, a.act:focus-visible .cameo { transform: translateY(-4px) scale(1.03); }
  a.act:hover .title { color: #7d1a38; }
  a.act:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }

  .act.next .numeral { color: #d8c6a8; }
  .act.next .cameo { background: none; box-shadow: none; border: 2px dashed #d9c3a0; }
  .act.next .cameo svg { width: 24%; color: #e2cfaa; filter: none; }

  /* ---------- about + footlights ---------- */
  .about { padding: 0 16px clamp(64px, 9vh, 100px); text-align: center; }
  .about p {
    max-width: 760px;
    margin: 0 auto;
    font-style: italic;
    font-size: clamp(22px, 2.4vw, 32px);
    line-height: 1.35;
    color: var(--cream);
  }
  footer {
    position: relative;
    padding: 46px 16px 40px;
    background: #1c040c;
    text-align: center;
    font-family: "Jost", system-ui, sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: #b98f86;
  }
  .footlights { position: absolute; left: 0; top: -12px; width: 100%; height: 24px; }

  /* ---------- the preview: what you're getting into ---------- */
  html.pv-lock { overflow: hidden; }
  dialog.preview {
    padding: 0;
    border: none;
    background: transparent;
    width: min(1040px, 94vw);
    max-width: none;
    max-height: 92vh;
    overflow: visible;
    color: var(--ink);
  }
  dialog.preview::backdrop { background: rgba(20,2,8,.74); backdrop-filter: blur(3px); }
  .pv {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    max-height: 92vh;
    overflow: auto;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 40px 100px rgba(10,0,4,.7), 0 0 0 1px #d9b877;
    animation: pvIn .22s ease-out;
  }
  @keyframes pvIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  .pv-media {
    background: #160309;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }
  .pv-shot {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    background: #000;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(217,184,119,.45);
  }
  .pv-thumbs { display: flex; gap: 10px; }
  .pv-thumb {
    padding: 0;
    width: 92px;
    border: 1px solid rgba(217,184,119,.3);
    border-radius: 3px;
    background: #000;
    cursor: pointer;
    opacity: .6;
    transition: opacity .2s, border-color .2s;
  }
  .pv-thumb img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 2px; }
  .pv-thumb[aria-pressed="true"] { opacity: 1; border-color: var(--gold); }
  .pv-thumb:hover { opacity: 1; }
  .pv-thumb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pv-thumb-label {
    margin-left: auto;
    align-self: center;
    font-family: "Jost", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #b99a6a;
  }
  .pv-info {
    position: relative;
    padding: 32px 30px 26px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }
  .pv-num { font-size: 26px; line-height: 1; color: var(--gold-deep); }
  .pv-info h2 { margin: 0; font-weight: 400; font-size: clamp(28px, 3vw, 38px); line-height: 1.05; padding-right: 36px; }
  .pv-info .platforms { justify-content: flex-start; margin-top: 2px; }
  .pv-blurb {
    margin: 6px 0 0;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    color: #4a2a33;
  }
  .pv-howto {
    margin: 2px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--paper-rule);
    font-family: "Jost", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #6a4a52;
  }
  .pv-howto b { display: block; margin-bottom: 2px; font-weight: 500; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--kind); }
  .pv-actions { margin-top: auto; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
  .pv-open, .pv-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    padding: 0 22px;
    border-radius: 999px;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
  }
  .pv-open {
    flex: 1 1 auto;
    color: #fff3ea;
    background: radial-gradient(circle at 40% 30%, #a8284e, #6e1430);
    border: 1px solid #d9b877;
    box-shadow: 0 10px 22px -10px rgba(110,20,48,.8);
  }
  .pv-open:hover { color: #fff; background: radial-gradient(circle at 40% 30%, #b8325a, #7d1a38); }
  .pv-open svg { width: 16px; height: 16px; }
  .pv-close { color: var(--ink); background: transparent; border: 1px solid #c9ad80; }
  .pv-close:hover { background: rgba(201,150,63,.1); }
  .pv-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: #8a6a72;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pv-x:hover { color: var(--ink); border-color: #e3cfae; }
  .pv-open:focus-visible, .pv-close:focus-visible, .pv-x:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }

  /* phones: the title sits clear of the valance swags (96px tall) */
  @media (max-width: 760px) {
    .marquee { padding-top: 108px; }
    header { padding-bottom: 92px; }
  }

  /* phones and narrow windows: the preview slides up from the bottom as one column */
  /* Sized to the *visible* screen (dvh): iPhone's vh counts the space behind
     Safari's toolbars, which pushed the sheet off-screen and made it scroll oddly.
     The screenshot stays put, only the text scrolls (if it must), the buttons stay
     pinned at the bottom, and scrolling never leaks through to the page behind. */
  @media (max-width: 760px) {
    dialog.preview { width: 100%; max-height: 92vh; max-height: 92dvh; margin: auto 0 0; }
    .pv {
      display: flex;
      flex-direction: column;
      max-height: 92vh;
      max-height: 92dvh;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      animation-name: pvUp;
    }
    @keyframes pvUp { from { transform: translateY(40px); opacity: 0; } }
    .pv-media { flex: none; padding: 12px 12px 8px; gap: 8px; }
    .pv-shot { max-height: 30vh; max-height: 30dvh; }
    .pv-thumb { width: 60px; }
    .pv-thumb-label { font-size: 11px; }
    .pv-info {
      position: static;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 16px 18px 0;
      gap: 8px;
    }
    .pv-num { font-size: 22px; }
    .pv-info h2 { font-size: 28px; padding-right: 0; }
    .pv-blurb { margin-top: 2px; font-size: 15px; line-height: 1.5; }
    .pv-howto { font-size: 13px; padding-top: 10px; }
    .pv-actions {
      position: sticky;
      bottom: 0;
      margin: 4px -18px 0;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      background: var(--paper);
      box-shadow: 0 -10px 16px -12px rgba(59,15,31,.35);
    }
    .pv-actions { flex-wrap: nowrap; }
    .pv-open, .pv-close { min-height: 48px; padding: 0 16px; font-size: 14px; letter-spacing: 1px; white-space: nowrap; }
    .pv-close { flex: none; }
    /* the close ✕ rides on the screenshot so it is always within reach */
    .pv-x {
      top: 18px;
      right: 18px;
      color: #fff3ea;
      background: rgba(20,3,9,.62);
      border-color: rgba(217,184,119,.5);
    }
    .pv-x:hover { color: #fff; border-color: var(--gold); }
  }
  /* very short screens (small phones, landscape): drop the thumbnails */
  @media (max-width: 760px) and (max-height: 700px) {
    .pv-thumbs { display: none; }
    .pv-shot { max-height: 26vh; max-height: 26dvh; }
  }

  @media (prefers-reduced-motion: reduce) { .cameo { transition: none; } .pv { animation: none; } }
</style>
</head>

<script>
  // Builds the playbill from games.js. Add a game there; nothing here needs to change.
  (function () {
    var games = window.NORA_GAMES || [];
    var list = document.getElementById('programme');
    if (!games.length || !list) return;

    function roman(n) {
      var map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
      var out = '';
      map.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
      return out;
    }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    var DEVICE_ICONS = {
      PC: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 14h5M8 11v3"/></svg>',
      iPad: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="1.5" width="11" height="13" rx="1.6"/><path d="M7.3 12.3h1.4"/></svg>',
      iPhone: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6"/><path d="M7.3 12.3h1.4"/></svg>'
    };
    function emblem(inner) {
      return '<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }

    // ---------- preview dialog ----------
    var dlg = document.getElementById('preview');
    var canPreview = !!(dlg && typeof dlg.showModal === 'function');
    var $ = function (id) { return document.getElementById(id); };

    function showShot(g, k) {
      var shot = $('pv-shot');
      shot.src = g.shots[k];
      shot.alt = g.title + (k === 0 ? ' in play' : ', title screen');
      [].forEach.call($('pv-thumbs').querySelectorAll('.pv-thumb'), function (b, n) {
        b.setAttribute('aria-pressed', n === k ? 'true' : 'false');
      });
      $('pv-thumbs').lastChild.textContent = k === 0 ? 'In play' : 'Title screen';
    }

    function openPreview(g, i) {
      $('pv-num').textContent = roman(i + 1);
      $('pv-title').textContent = g.title;
      $('pv-kind').textContent = g.kind;
      $('pv-blurb').textContent = g.blurb || '';
      $('pv-howto').textContent = g.howto || '';
      $('pv-open').href = g.href;
      $('pv-open').setAttribute('aria-label', 'Open ' + g.title + ' in a new tab');

      var plat = $('pv-plat');
      plat.textContent = '';
      (g.platforms || []).forEach(function (name, k) {
        var s = el('span', k === 0 ? 'best' : '');
        s.innerHTML = DEVICE_ICONS[name] || '';
        s.appendChild(document.createTextNode(k === 0 ? 'Best on ' + name : name));
        plat.appendChild(s);
      });

      var thumbs = $('pv-thumbs');
      thumbs.textContent = '';
      var shots = g.shots || [];
      $('pv-shot').hidden = !shots.length;
      shots.forEach(function (src, k) {
        var b = el('button', 'pv-thumb');
        b.type = 'button';
        b.setAttribute('aria-label', k === 0 ? 'Show the game in play' : 'Show the title screen');
        var im = el('img');
        im.src = src;
        im.alt = '';
        b.appendChild(im);
        b.addEventListener('click', function () { showShot(g, k); });
        thumbs.appendChild(b);
      });
      thumbs.appendChild(el('span', 'pv-thumb-label'));
      thumbs.hidden = shots.length < 2;
      if (shots.length) showShot(g, 0);

      document.documentElement.classList.add('pv-lock');
      dlg.showModal();
      $('pv-open').focus();
    }

    function closePreview() { if (dlg.open) dlg.close(); }
    if (canPreview) {
      dlg.addEventListener('close', function () { document.documentElement.classList.remove('pv-lock'); });
      dlg.addEventListener('click', function (e) { if (e.target === dlg) closePreview(); }); // click outside the card
      $('pv-x').addEventListener('click', closePreview);
      $('pv-close').addEventListener('click', closePreview);
      $('pv-open').addEventListener('click', function () { setTimeout(closePreview, 0); });
    }

    list.textContent = '';
    games.forEach(function (g, i) {
      var li = el('li');
      var a = el('a', 'act');
      a.href = g.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', g.title + ', ' + g.kind +
        (g.platforms && g.platforms.length ? ', best on ' + g.platforms.join(', ') : '') +
        (canPreview ? ', opens a preview' : ' (opens in a new tab)'));
      if (canPreview) {
        a.setAttribute('aria-haspopup', 'dialog');
        a.addEventListener('click', function (e) {
          // ctrl/cmd/shift/middle-click still go straight to the game
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          openPreview(g, i);
        });
      }

      var cameo = el('div', 'cameo');
      cameo.style.setProperty('--ground', g.ground);
      cameo.style.setProperty('--foil', g.foil);
      cameo.innerHTML = emblem(g.emblem);

      var text = el('div');
      text.appendChild(el('div', 'title', g.title));
      text.appendChild(el('div', 'kind', g.kind));
      if (g.platforms && g.platforms.length) {
        var plats = el('div', 'platforms');
        plats.setAttribute('aria-label', 'Plays best on ' + g.platforms[0] +
          (g.platforms.length > 1 ? '; also ' + g.platforms.slice(1).join(', ') : ''));
        g.platforms.forEach(function (name, k) {
          var s = el('span', k === 0 ? 'best' : '');
          s.setAttribute('aria-hidden', 'true');
          s.innerHTML = (DEVICE_ICONS[name] || '') ;
          s.appendChild(document.createTextNode(name));
          plats.appendChild(s);
        });
        text.appendChild(plats);
      }

      a.appendChild(el('div', 'numeral', roman(i + 1)));
      a.appendChild(cameo);
      a.appendChild(text);
      li.appendChild(a);
      list.appendChild(li);
    });

    // the empty act at the end: room for the next game
    var next = el('li');
    var row = el('div', 'act next');
    row.setAttribute('aria-hidden', 'true');
    row.appendChild(el('div', 'numeral', roman(games.length + 1)));
    var empty = el('div', 'cameo');
    empty.innerHTML = '<svg viewBox="0 0 26 26"><path d="M13 0l3.2 9.8 9.8 3.2-9.8 3.2-3.2 9.8-3.2-9.8-9.8-3.2 9.8-3.2z" fill="currentColor"/></svg>';
    row.appendChild(empty);
    row.appendChild(el('div'));
    next.appendChild(row);
    list.appendChild(next);
  })();
</script>
</body>
</html>
