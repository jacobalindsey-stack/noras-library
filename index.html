<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nora's Library</title>
<meta name="description" content="Games made by Nora: witches, cats, moonlit cities, sea voyages and a bakery at dusk.">
<meta name="theme-color" content="#2a0712">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%235a1229'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23e0b86a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --velvet-deep: #2a0712;
    --velvet: #6e1730;
    --gold: #e0b86a;
    --gold-deep: #b9852f;
    --paper: #fffaf3;
    --paper-rule: #ecdcbf;
    --ink: #3b0f1f;
    --kind: #8e4a5a;
    --cream: #f6e2cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--velvet-deep);
    color: var(--ink);
    font-family: "DM Serif Display", Georgia, serif;
    overflow-x: hidden;
  }

  /* ---------- the curtain ---------- */
  header {
    position: relative;
    padding: 0 16px 150px;
    background:
      radial-gradient(ellipse 60% 70% at 50% 42%, rgba(255,206,140,.30), rgba(255,206,140,0) 70%),
      repeating-linear-gradient(90deg, #4a0c20 0px, #6e1730 26px, #8a2240 34px, #6e1730 44px, #4a0c20 72px);
  }
  .valance, .sparkles, .fringe { position: absolute; left: 0; pointer-events: none; }
  .valance { top: 0; width: 100%; height: 96px; }
  .sparkles { inset: 0; width: 100%; height: 100%; }
  .fringe { bottom: 0; width: 100%; height: 34px; }
  .marquee { position: relative; max-width: 1000px; margin: 0 auto; padding-top: 190px; text-align: center; }
  h1 {
    margin: 0;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(60px, 10.5vw, 150px);
    line-height: .95;
    background: linear-gradient(180deg, #fff6df 0%, #f2d08a 48%, #c48a35 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(255,200,120,.35)) drop-shadow(0 3px 0 rgba(58,8,24,.6));
  }
  .flourish { display: block; margin: 30px auto 0; max-width: 100%; }

  /* ---------- the programme card ---------- */
  main { position: relative; margin-top: -96px; padding: 0 16px 110px; }
  .card {
    position: relative;
    max-width: 1060px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 40px 90px rgba(10,0,4,.6), 0 0 0 1px #e6cfae;
    padding: clamp(28px, 5vw, 64px) clamp(16px, 5vw, 72px);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid #d9b877;
    outline: 1px solid var(--paper-rule);
    outline-offset: -6px;
    border-radius: 2px;
    pointer-events: none;
  }
  .programme { position: relative; list-style: none; margin: 0; padding: 0; }
  .programme li + li { border-top: 1px solid var(--paper-rule); }

  /* one centred column: numeral | cameo | title, the whole group balanced in the card */
  .act {
    display: grid;
    grid-template-columns: 76px 156px minmax(0, 400px);
    column-gap: 40px;
    justify-content: center;
    align-items: center;
    padding: 34px 0;
    color: inherit;
    text-decoration: none;
    border-radius: 6px;
  }
  .numeral { text-align: center; font-size: 46px; line-height: 1; color: var(--gold-deep); }
  .cameo {
    width: 156px;
    height: 200px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.10), rgba(255,255,255,0) 60%), var(--ground);
    box-shadow:
      inset 0 0 0 6px var(--ground),
      inset 0 0 0 7px color-mix(in srgb, var(--foil) 60%, transparent),
      0 0 0 4px var(--paper),
      0 0 0 5px #d9b877,
      0 18px 30px -12px rgba(42,7,18,.55),
      0 0 44px -6px color-mix(in srgb, var(--foil) 55%, transparent);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .cameo svg {
    width: 78px;
    height: 78px;
    color: var(--foil);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--foil) 40%, transparent));
  }
  .title { font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; color: var(--ink); }
  .kind {
    margin-top: 12px;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--kind);
  }
  a.act:hover .cameo, a.act:focus-visible .cameo { transform: translateY(-4px) scale(1.03); }
  a.act:hover .title { color: #7d1a38; }
  a.act:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 6px; }

  .act.next .numeral { color: #d8c6a8; }
  .act.next .cameo { background: none; box-shadow: none; border: 2px dashed #d9c3a0; }
  .act.next .cameo svg { width: 26px; height: 26px; color: #e2cfaa; filter: none; }

  @media (max-width: 720px) {
    .act { grid-template-columns: 1fr; row-gap: 18px; justify-items: center; text-align: center; }
    .numeral { font-size: 38px; }
  }

  /* ---------- about + footlights ---------- */
  .about { padding: 0 16px 120px; text-align: center; }
  .about p {
    max-width: 760px;
    margin: 0 auto;
    font-style: italic;
    font-size: clamp(26px, 3.2vw, 38px);
    line-height: 1.35;
    color: var(--cream);
  }
  footer {
    position: relative;
    padding: 46px 16px 40px;
    background: #1c040c;
    text-align: center;
    font-family: "Jost", system-ui, sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: #b98f86;
  }
  .footlights { position: absolute; left: 0; top: -12px; width: 100%; height: 24px; }

  @media (prefers-reduced-motion: reduce) { .cameo { transition: none; } }
</style>
</head>
<body>

    <path d="M0 40c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0" fill="none" stroke="#e0b86a" stroke-width="3"/>
    <path d="M0 46c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0c40 52 140 52 180 0" fill="none" stroke="#e0b86a" stroke-width="1" opacity=".5"/>

      <circle cx="10" cy="22" r="3" fill="#e0b86a"/><circle cx="330" cy="22" r="3" fill="#e0b86a"/>

<script src="games.js"></script>
<script>
  // Builds the playbill from games.js. Add a game there; nothing here needs to change.
  (function () {
    var games = window.NORA_GAMES || [];
    var list = document.getElementById('programme');
    if (!games.length || !list) return;

    function roman(n) {
      var map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
      var out = '';
      map.forEach(function (p) { while (n >= p[0]) { out += p[1]; n -= p[0]; } });
      return out;
    }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function emblem(inner) {
      return '<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }

    list.textContent = '';
    games.forEach(function (g, i) {
      var li = el('li');
      var a = el('a', 'act');
      a.href = g.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', g.title + ', ' + g.kind + ' (opens in a new tab)');

      var cameo = el('div', 'cameo');
      cameo.style.setProperty('--ground', g.ground);
      cameo.style.setProperty('--foil', g.foil);
      cameo.innerHTML = emblem(g.emblem);

      var text = el('div');
      text.appendChild(el('div', 'title', g.title));
      text.appendChild(el('div', 'kind', g.kind));

      a.appendChild(el('div', 'numeral', roman(i + 1)));
      a.appendChild(cameo);
      a.appendChild(text);
      li.appendChild(a);
      list.appendChild(li);
    });

    // the empty act at the end: room for the next game
    var next = el('li');
    var row = el('div', 'act next');
    row.setAttribute('aria-hidden', 'true');
    row.appendChild(el('div', 'numeral', roman(games.length + 1)));
    var empty = el('div', 'cameo');
    empty.innerHTML = '<svg viewBox="0 0 26 26"><path d="M13 0l3.2 9.8 9.8 3.2-9.8 3.2-3.2 9.8-3.2-9.8-9.8-3.2 9.8-3.2z" fill="currentColor"/></svg>';
    row.appendChild(empty);
    row.appendChild(el('div'));
    next.appendChild(row);
    list.appendChild(next);
  })();
</script>
